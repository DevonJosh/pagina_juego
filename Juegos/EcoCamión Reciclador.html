<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>EcoCamión Reciclador</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    font-family:"Trebuchet MS",Arial,sans-serif;
    color:#254c39;
}

body{
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:#b8e6f0;
}

button{
    font:inherit;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

button:focus-visible{
    outline:4px solid #ffae35;
    outline-offset:3px;
}

button:disabled{
    cursor:default;
}

.oculto{
    display:none!important;
}

/* DISTRIBUCIÓN */

#juego{
    width:100%;
    height:100dvh;
    display:grid;
    grid-template-rows:57% 43%;
}

/* ENCABEZADO */

.encabezado{
    position:absolute;
    top:max(10px,env(safe-area-inset-top));
    left:14px;
    right:14px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.titulo,
.indicador,
.boton-pequeno{
    background:#fffffff2;
    border:2px solid #cce4cc;
    border-radius:15px;
    padding:9px 12px;
    box-shadow:0 4px 0 #214b3420;
    font-weight:bold;
}

.titulo{
    font-size:clamp(16px,2vw,25px);
}

.hud{
    display:flex;
    align-items:center;
    gap:7px;
}

.boton-pequeno{
    min-height:42px;
}

/* ESCENARIO */

#escenario{
    position:relative;
    overflow:hidden;
    isolation:isolate;
    background:linear-gradient(#b0e7f8,#dff0cf);
}

/*
UNA SOLA IMAGEN DE FONDO.

No se repite.
No se desplaza.
Se muestra completa ocupando el escenario.
*/

#imagen-fondo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:fill;
    z-index:0;
    pointer-events:none;
}

/* CASAS */

#casas{
    position:absolute;
    inset:0;
    z-index:2;
    will-change:transform;
}

.casa{
    position:absolute;
    bottom:27%;
    width:var(--ancho-casa,220px);
    height:63%;
    display:flex;
    justify-content:center;
    align-items:flex-end;
}

.casa img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    filter:drop-shadow(0 5px 3px #0002);
    pointer-events:none;
}

.casa-respaldo{
    font-size:130px;
    line-height:1;
}

/* CAMIÓN */

#camion{
    position:absolute;
    left:25%;
    bottom:7%;
    width:clamp(170px,23vw,310px);
    height:41%;
    transform:translateX(-50%);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:4;
}

#imagen-camion{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    transform-origin:center 85%;
    pointer-events:none;
}

#camion-respaldo{
    font-size:110px;
    line-height:1;
    transform:scaleX(-1);
}

#camion.andando #imagen-camion{
    animation:suspension .24s ease-in-out infinite;
}

@keyframes suspension{
    50%{
        transform:translateY(-3px) rotate(.35deg);
    }
}

.polvo{
    position:absolute;
    bottom:2%;
    left:0;
    width:23px;
    height:17px;
    border-radius:50%;
    background:#fff2db;
    box-shadow:
        15px -7px 0 3px #fff2db,
        28px 1px 0 1px #fff2db;
    opacity:0;
    z-index:-1;
}

#camion.andando .polvo{
    animation:nube .65s ease-out infinite;
}

#camion.andando .polvo.segundo{
    left:58%;
    animation-delay:.3s;
}

@keyframes nube{
    from{
        opacity:.8;
        transform:translateX(0) scale(.5);
    }
    to{
        opacity:0;
        transform:translateX(-65px) scale(1.5);
    }
}

/* INFORMACIÓN */

.info-escenario{
    position:absolute;
    top:74px;
    left:15px;
    right:15px;
    z-index:5;
    display:flex;
    justify-content:space-between;
    gap:8px;
    pointer-events:none;
}

.info-escenario span{
    background:#ffffffe8;
    padding:7px 11px;
    border-radius:12px;
    font-size:12px;
    font-weight:bold;
}

#ruta{
    position:absolute;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    padding:6px 12px;
    border-radius:20px;
    background:#ffffffe8;
    z-index:5;
}

.punto{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#bfd2ba;
}

.punto.completo{
    background:#229d67;
}

.punto.actual{
    background:#f3b138;
    box-shadow:0 0 0 3px #f3b13833;
}

/* CONTROLES */

#controles{
    background:linear-gradient(#fff8cf,#ffebba);
    border-top:5px dashed #e7b85d;
    padding:clamp(12px,2vw,26px);
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(150px,.27fr);
    gap:clamp(15px,3vw,42px);
    min-height:0;
}

#clasificacion{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:12px;
    min-width:0;
}

.fila-progreso{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.fila-progreso h2{
    font-size:clamp(16px,1.8vw,24px);
}

#contador{
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

/* TACHOS */

#tachos{
    display:grid;
    grid-template-columns:repeat(var(--cantidad,4),minmax(0,1fr));
    gap:clamp(6px,1.2vw,18px);
    align-items:end;
}

.tacho{
    min-width:0;
    height:clamp(100px,22vh,205px);
    border:0;
    background:transparent;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    border-radius:12px;
    transition:transform .15s;
}

.tacho img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    filter:drop-shadow(0 5px 2px #0002);
    pointer-events:none;
}

.tacho:not(:disabled):hover{
    transform:translateY(-5px);
}

.tacho.correcto{
    animation:acierto .35s ease;
}

.tacho.incorrecto{
    animation:error .3s ease;
}

@keyframes acierto{
    50%{
        transform:translateY(-8px) scale(1.05);
    }
}

@keyframes error{
    25%{
        transform:translateX(-6px);
    }
    75%{
        transform:translateX(6px);
    }
}

.tacho-respaldo{
    width:100%;
    height:90%;
    min-height:75px;
    border:3px solid #0003;
    border-radius:12px 12px 17px 17px;
    box-shadow:0 5px 0 #0003;
    background:var(--color);
    color:var(--texto);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:4px;
}

.tacho-respaldo .simbolo{
    font-size:clamp(25px,3vw,42px);
}

.tacho-respaldo strong{
    font-size:clamp(9px,1vw,14px);
    text-align:center;
}

.tacho-respaldo small{
    font-size:clamp(16px,2vw,25px);
}

/* RESIDUO */

#panel-residuo{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:0;
}

#panel-residuo small{
    text-align:center;
    font-size:11px;
    letter-spacing:1px;
    font-weight:bold;
    color:#8a7950;
}

#imagen-residuo{
    width:100%;
    height:70%;
    object-fit:contain;
    filter:drop-shadow(0 7px 4px #0002);
    animation:flotar 2s ease-in-out infinite;
}

#residuo-respaldo{
    font-size:clamp(70px,9vw,125px);
    line-height:1.2;
}

@keyframes flotar{
    50%{
        transform:translateY(-5px) rotate(2deg);
    }
}

/* MENSAJE Y BARRA */

#mensaje{
    min-height:22px;
    font-size:clamp(12px,1.2vw,16px);
    line-height:1.2;
    font-weight:bold;
    color:#33774f;
}

#mensaje.error{
    color:#b34d37;
}

.barra{
    height:8px;
    background:#e6d7ab;
    border-radius:10px;
    overflow:hidden;
}

#relleno{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#23ae76,#a3d467);
    transition:width .3s;
}

/* MENÚ Y FINAL */

.pantalla{
    position:fixed;
    inset:0;
    z-index:30;
    background:#194e3bcc;
    backdrop-filter:blur(7px);
    padding:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:auto;
}

.tarjeta{
    width:100%;
    max-width:680px;
    max-height:100%;
    overflow:auto;
    background:#fffdf4;
    border:5px solid white;
    border-radius:28px;
    padding:clamp(22px,4vw,40px);
    text-align:center;
    box-shadow:0 20px 60px #0003;
}

.icono-grande{
    font-size:56px;
}

.tarjeta h1{
    font-size:clamp(27px,4vw,39px);
    color:#17734e;
    margin:10px 0;
}

.tarjeta p{
    font-size:14px;
    line-height:1.5;
    color:#69806b;
}

.niveles{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:22px 0;
}

.nivel{
    background:white;
    border:2px solid #d5e3cf;
    border-radius:17px;
    padding:14px 5px;
    color:#355d44;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
}

.nivel.activo{
    border-color:#27975f;
    background:#eaf7e4;
    box-shadow:0 4px 0 #27975f;
}

.nivel span{
    font-size:27px;
}

.nivel small{
    font-size:11px;
}

.principal{
    width:100%;
    padding:15px 22px;
    border:0;
    border-radius:16px;
    background:#18895b;
    box-shadow:0 6px 0 #106642;
    color:white;
    font-size:20px;
    font-weight:bold;
    margin:9px 0 17px;
}

.secundario{
    padding:10px 16px;
    background:white;
    color:#365d45;
    border:2px solid #d0dfca;
    border-radius:12px;
    font-weight:bold;
}

#resultado{
    font-size:24px;
    color:#188454;
    font-weight:bold;
    margin:20px 0;
}

/* CELULAR VERTICAL */

@media(max-width:700px) and (orientation:portrait){
    #juego{
        grid-template-rows:49% 51%;
    }

    .encabezado{
        left:8px;
        right:8px;
        gap:4px;
    }

    .titulo{
        font-size:15px;
        padding:7px;
    }

    .hud{
        gap:4px;
    }

    .indicador,
    .boton-pequeno{
        padding:7px;
        min-height:38px;
        font-size:13px;
    }

    .texto-menu{
        display:none;
    }

    .info-escenario{
        top:61px;
        left:10px;
        right:10px;
    }

    .info-escenario span{
        padding:6px 8px;
        font-size:10px;
    }

    #controles{
        grid-template-columns:1fr;
        grid-template-rows:82px minmax(0,1fr);
        gap:6px;
        padding:10px 12px 12px;
    }

    #panel-residuo{
        grid-row:1;
        flex-direction:row;
        gap:12px;
    }

    #panel-residuo small{
        max-width:120px;
        font-size:10px;
    }

    #imagen-residuo{
        width:85px;
        height:78px;
    }

    #residuo-respaldo{
        font-size:65px;
    }

    #clasificacion{
        grid-row:2;
        gap:7px;
        justify-content:space-evenly;
    }

    .fila-progreso h2{
        font-size:15px;
    }

    #contador{
        font-size:11px;
    }

    #tachos{
        grid-template-columns:repeat(4,minmax(0,1fr));
        gap:8px;
    }

    .tacho{
        height:clamp(65px,10vh,96px);
    }

    .tacho-respaldo{
        min-height:60px;
    }

    .tacho-respaldo .simbolo{
        font-size:23px;
    }

    .tacho-respaldo strong{
        font-size:9px;
    }

    .tacho-respaldo small{
        font-size:15px;
    }

    #controles.cuatro .tacho{
        height:clamp(100px,17vh,150px);
    }

    #mensaje{
        font-size:11px;
        min-height:27px;
    }

    #camion{
        left:27%;
        width:170px;
        height:36%;
    }

    .casa{
        height:59%;
    }

    .niveles{
        gap:6px;
    }

    .nivel b{
        font-size:13px;
    }

    .nivel small{
        font-size:10px;
    }
}

/* CELULAR HORIZONTAL */

@media(max-height:550px) and (orientation:landscape){
    #juego{
        grid-template-rows:54% 46%;
    }

    .encabezado{
        top:7px;
    }

    .titulo{
        font-size:17px;
        padding:6px 10px;
    }

    .indicador,
    .boton-pequeno{
        padding:6px 9px;
        min-height:34px;
        font-size:13px;
    }

    .info-escenario{
        top:51px;
    }

    .info-escenario span{
        padding:5px 8px;
        font-size:10px;
    }

    #controles{
        grid-template-columns:1fr 130px;
        padding:8px 18px;
        gap:18px;
    }

    #clasificacion{
        gap:6px;
    }

    .fila-progreso h2{
        font-size:14px;
    }

    .tacho{
        height:clamp(65px,24vh,100px);
    }

    .tacho-respaldo{
        min-height:58px;
    }

    .tacho-respaldo .simbolo{
        font-size:23px;
    }

    .tacho-respaldo strong{
        font-size:9px;
    }

    .tacho-respaldo small{
        font-size:15px;
    }

    #imagen-residuo{
        height:85px;
    }

    #panel-residuo small{
        font-size:9px;
    }

    #residuo-respaldo{
        font-size:65px;
    }

    #mensaje{
        font-size:10px;
        min-height:14px;
    }

    #camion{
        width:190px;
        height:36%;
    }

    .casa{
        height:57%;
    }

    .tarjeta{
        padding:15px 22px;
    }

    .icono-grande{
        font-size:28px;
    }

    .tarjeta h1{
        margin:5px;
        font-size:26px;
    }

    .tarjeta p{
        font-size:12px;
    }

    .niveles{
        margin:12px 0;
    }

    .nivel{
        padding:8px;
        gap:3px;
    }

    .nivel span{
        font-size:20px;
    }

    .principal{
        padding:10px;
        margin-bottom:10px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation:none!important;
        transition-duration:.01s!important;
    }
}
</style>
</head>

<body>

<main id="juego">

    <header class="encabezado">
        <div class="titulo">🚛 EcoCamión</div>

        <div class="hud">

            <button
                class="boton-pequeno"
                id="boton-menu"
                aria-label="Volver al menú"
            >
                ⚙️ <span class="texto-menu">Menú</span>
            </button>

            <span class="indicador" id="vidas">
                ❤️❤️❤️
            </span>

            <span class="indicador">
                ⭐ <span id="puntos">0</span>
            </span>

            <button
                class="boton-pequeno"
                id="boton-sonido"
                aria-label="Activar sonido"
            >🔇</button>

        </div>
    </header>

    <section id="escenario" aria-label="Ruta del camión">

        <img id="imagen-fondo" alt="">

        <div id="casas"></div>

        <div class="info-escenario">
            <span id="nombre-escenario">🌷 Parque</span>
            <span id="numero-casa">Casa 1 / 6</span>
        </div>

        <div id="camion">
            <img id="imagen-camion" alt="Camión recolector">

            <span id="camion-respaldo" class="oculto">
                🚛
            </span>

            <i class="polvo"></i>
            <i class="polvo segundo"></i>
        </div>

        <div id="ruta" aria-hidden="true"></div>

    </section>

    <section id="controles">

        <div id="clasificacion">

            <div class="fila-progreso">
                <h2>¿En qué tacho va?</h2>
                <span id="contador">0 / 10</span>
            </div>

            <div id="tachos"></div>

            <div id="mensaje" role="status" aria-live="polite">
                ¡Vamos a reciclar!
            </div>

            <div
                id="barra-progreso"
                class="barra"
                role="progressbar"
                aria-label="Residuos reciclados"
                aria-valuemin="0"
                aria-valuemax="10"
                aria-valuenow="0"
            >
                <div id="relleno"></div>
            </div>

        </div>

        <div id="panel-residuo">
            <small>CLASIFICA ESTE RESIDUO</small>

            <img
                id="imagen-residuo"
                alt="Residuo para clasificar"
            >

            <span
                id="residuo-respaldo"
                class="oculto"
            ></span>
        </div>

    </section>
</main>

<!-- MENÚ -->

<div id="menu" class="pantalla">
    <section class="tarjeta">

        <div class="icono-grande">🚛🌱</div>

        <h1>¡Una ruta por el planeta!</h1>

        <p>
            Clasifica los residuos y acompaña al camión.<br>
            <b>Tres vidas en todas las dificultades.</b>
        </p>

        <div class="niveles">

            <button
                class="nivel activo"
                data-nivel="facil"
                aria-pressed="true"
            >
                <span>🌱</span>
                <b>Fácil</b>
                <small>10 residuos</small>
                <small>4 tachos con referencias</small>
            </button>

            <button
                class="nivel"
                data-nivel="intermedio"
                aria-pressed="false"
            >
                <span>🌟</span>
                <b>Intermedio</b>
                <small>25 residuos</small>
                <small>7 tachos con referencias</small>
            </button>

            <button
                class="nivel"
                data-nivel="dificil"
                aria-pressed="false"
            >
                <span>🔥</span>
                <b>Difícil</b>
                <small>50 residuos</small>
                <small>4 → 5 → 6 → 7 tachos</small>
                <small>Sin referencias</small>
            </button>

        </div>

        <button id="boton-iniciar" class="principal">
            ¡A reciclar! →
        </button>

        <p>
            Llega a la última casa para descubrir otro escenario.
        </p>

    </section>
</div>

<!-- FINAL -->

<div id="final" class="pantalla oculto">
    <section class="tarjeta">

        <div id="icono-final" class="icono-grande">🏆</div>

        <h1 id="titulo-final"></h1>
        <p id="texto-final"></p>

        <div id="resultado"></div>

        <button id="boton-reiniciar" class="principal">
            🔄 Volver a jugar
        </button>

        <button id="boton-final-menu" class="secundario">
            Cambiar dificultad
        </button>

    </section>
</div>

<script>
"use strict";

/* ==========================================================
   CARPETA DE LAS IMÁGENES

   Este código supone:

   Tu archivo HTML está junto a la carpeta img_EcoCamion.

   Dentro de img_EcoCamion están:
   - Los cinco fondos.
   - Las treinta casitas.
   - Los catorce tachos.
   - Los residuos.
   - camion.png

   Si la ubicación es diferente, cambia SOLO esta constante.
   ========================================================== */

const CARPETA = "../assets/img_EcoCamion/";

/* ==========================================================
   CAMIÓN
   ========================================================== */

const ARCHIVO_CAMION = "camion.png";

/* ==========================================================
   FONDOS Y CASITAS

   Todos los nombres se escriben completos, incluyendo .png.
   No se añade ninguna extensión automáticamente.
   ========================================================== */

const ESCENARIOS = [
    {
        nombre: "🌷 Parque",
        fondo: "Parque primaveral con flores y colinas-1.png",
        casas: [
            "Seis casitas encantadoras del parque-1.1.png",
            "Seis casitas encantadoras del parque-1.2.png",
            "Seis casitas encantadoras del parque-1.3.png",
            "Seis casitas encantadoras del parque-1.4.png",
            "Seis casitas encantadoras del parque-1.5.png",
            "Seis casitas encantadoras del parque-1.6.png"
        ]
    },
    {
        nombre: "🏫 Escuela",
        fondo: "Paisaje escolar verde con acera y carretera-4.png",
        casas: [
            "Seis edificios escolares de cuento-1.1.png",
            "Seis edificios escolares de cuento-1.2.png",
            "Seis edificios escolares de cuento-1.3.png",

/* ==========================================================

const $ = id => document.getElementById(id);

let nivel = "facil";
let puntos = 0;
let vidas = 3;

let escenarioActual = 0;
let completados = 0;
let completadosEscenario = 0;

let activo = false;
let bloqueado = true;

let residuoActual = null;
let cola = [];

let sesion = 0;

let anchoCasa = 220;
let separacion = 310;
let anclaCamion = 0;

let sonido = false;
let contextoAudio;

const esperar = ms => new Promise(
    resolver => setTimeout(resolver, ms)
);

/* ==========================================================
   RUTAS Y CARGA DIRECTA DE IMÁGENES
   ========================================================== */

function obtenerURL(archivo) {
    return new URL(
        CARPETA + archivo,
        document.baseURI
    ).href;
}

function cargarImagen(imagen, archivo, respaldo) {
    imagen.onload = () => {
        imagen.classList.remove("oculto");

        if (respaldo) {
            respaldo.classList.add("oculto");
        }
    };

    imagen.onerror = () => {
        imagen.classList.add("oculto");

        if (respaldo) {
            respaldo.classList.remove("oculto");
        }

        console.warn(
            "No se encontró la imagen:",
            obtenerURL(archivo)
        );
    };

    imagen.classList.remove("oculto");

    if (respaldo) {
        respaldo.classList.add("oculto");
    }

    imagen.src = obtenerURL(archivo);
}

function cargarCamion() {
    cargarImagen(
        $("imagen-camion"),
        ARCHIVO_CAMION,
        $("camion-respaldo")
    );
}

/* ==========================================================
   SONIDOS
   ========================================================== */

function tono(frecuencia) {
    if (!sonido) return;

    try {
        contextoAudio ??= new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        contextoAudio.resume();

        const oscilador = contextoAudio.createOscillator();
        const ganancia = contextoAudio.createGain();

        oscilador.frequency.value = frecuencia;

        ganancia.gain.setValueAtTime(
            .06,
            contextoAudio.currentTime
        );

        ganancia.gain.exponentialRampToValueAtTime(
            .001,
            contextoAudio.currentTime + .18
        );

        oscilador.connect(ganancia);
        ganancia.connect(contextoAudio.destination);

        oscilador.start();
        oscilador.stop(contextoAudio.currentTime + .18);

    } catch (error) {
        // El juego puede funcionar sin sonido.
    }
}

/* ==========================================================
   REGLAS DE LOS NIVELES
   ========================================================== */

function cantidadTachos() {
    if (nivel === "facil") {
        return 4;
    }

    if (nivel === "intermedio") {
        return 7;
    }

    // Parque 4, Escuela 5, Ciudad 6, Playa 7, Bosque 7.
    return [4, 5, 6, 7, 7][escenarioActual];
}

function tiposDisponibles() {
    return ORDEN.slice(0, cantidadTachos());
}

function residuosPorEscenario() {
    return NIVELES[nivel].total / ESCENARIOS.length;
}

/* ==========================================================
   INTERFAZ
   ========================================================== */

function bloquear(valor) {
    bloqueado = valor;

    document.querySelectorAll(".tacho").forEach(
        boton => {
            boton.disabled = valor || !activo;
        }
    );
}

function mostrarMensaje(texto, esError = false) {
    $("mensaje").textContent = texto;

    $("mensaje").classList.toggle(
        "error",
        esError
    );
}

function actualizarIndicadores() {
    $("puntos").textContent = puntos;

    $("vidas").textContent =
        "❤️".repeat(vidas) +
        "🤍".repeat(3 - vidas);

    $("vidas").setAttribute(
        "aria-label",
        `${vidas} vidas`
    );

    const total = NIVELES[nivel].total;

    $("contador").textContent =
        `${completados} / ${total}`;

    $("relleno").style.width =
        `${completados / total * 100}%`;

    $("barra-progreso").setAttribute(
        "aria-valuemax",
        total
    );

    $("barra-progreso").setAttribute(
        "aria-valuenow",
        completados
    );
}

/* ==========================================================
   CREAR LOS TACHOS
   ========================================================== */

function crearTachos() {
    const pistas = NIVELES[nivel].pistas;

    $("tachos").replaceChildren();

    $("tachos").style.setProperty(
        "--cantidad",
        cantidadTachos()
    );

    $("controles").classList.toggle(
        "cuatro",
        cantidadTachos() === 4
    );

    for (const tipo of tiposDisponibles()) {
        const datos = TIPOS[tipo];

        const boton = document.createElement("button");
        boton.className = "tacho";

        boton.setAttribute(
            "aria-label",
            pistas
                ? datos.nombre
                : `Tacho ${datos.color}`
        );

        const imagen = document.createElement("img");
        imagen.alt = "";
        imagen.draggable = false;

        const respaldo = document.createElement("span");

        respaldo.className = "tacho-respaldo oculto";

        respaldo.style.setProperty(
            "--color",
            datos.fondo
        );

        respaldo.style.setProperty(
            "--texto",
            datos.texto
        );

        respaldo.innerHTML =
            '<span class="simbolo">♻</span>' +
            (
                pistas
                    ? `<strong>${datos.nombre}</strong>
                       <small>${datos.referencia}</small>`
                    : ""
            );

        boton.append(imagen, respaldo);

        const archivo = pistas
            ? datos.conPistas
            : datos.sinPistas;

        cargarImagen(
            imagen,
            archivo,
            respaldo
        );

        boton.onclick = () => {
            responder(boton, tipo);
        };

        $("tachos").append(boton);
    }

    bloquear(bloqueado);
}

/* ==========================================================
   RECORRIDO
   ========================================================== */

function actualizarRuta() {
    const parada = Math.min(
        5,
        Math.round(
            completadosEscenario /
            residuosPorEscenario() * 5
        )
    );

    $("numero-casa").textContent =
        `Casa ${parada + 1} / 6`;

    $("ruta").innerHTML = Array.from(
        { length: 6 },

        (_, indice) => `
            <i class="punto ${
                indice < parada
                    ? "completo"
                    : indice === parada
                        ? "actual"
                        : ""
            }"></i>
        `
    ).join("");
}

function ajustarEscenario() {
    const ancho = $("escenario").clientWidth;

    anchoCasa = Math.max(
        160,
        Math.min(255, ancho * .18)
    );

    separacion = Math.max(
        260,
        anchoCasa + 90
    );

    const verticalMovil = window.matchMedia(
        "(max-width:700px) and (orientation:portrait)"
    ).matches;

    anclaCamion = ancho * (
        verticalMovil ? .27 : .25
    );

    document.querySelectorAll(".casa").forEach(
        (casa, indice) => {
            casa.style.setProperty(
                "--ancho-casa",
                anchoCasa + "px"
            );

            casa.style.left =
                (
                    anclaCamion +
                    indice * separacion -
                    anchoCasa / 2
                ) + "px";
        }
    );

    posicionarCasas(false);
}

function posicionarCasas(animar = true) {
    const avance = Math.min(
        1,
        completadosEscenario /
        residuosPorEscenario()
    );

    const desplazamiento =
        separacion * 5 * avance;

    $("casas").style.transition = animar
        ? "transform .7s ease-in-out"
        : "none";

    $("casas").style.transform =
        `translateX(${-desplazamiento}px)`;

    // El fondo no se mueve ni se repite.
    actualizarRuta();
}

function prepararEscenario() {
    const datos = ESCENARIOS[escenarioActual];

    $("nombre-escenario").textContent =
        datos.nombre;

    // Una sola imagen de fondo.
    cargarImagen(
        $("imagen-fondo"),
        datos.fondo,
        null
    );

    $("casas").replaceChildren();

    datos.casas.forEach(archivo => {
        const casa = document.createElement("div");
        casa.className = "casa";

        const imagen = document.createElement("img");
        imagen.alt = "";
        imagen.draggable = false;

        const respaldo = document.createElement("span");
        respaldo.className = "casa-respaldo oculto";

        respaldo.textContent =
            escenarioActual === 2
                ? "🏢"
                : escenarioActual === 1
                    ? "🏫"
                    : "🏡";

        casa.append(imagen, respaldo);

        $("casas").append(casa);

        cargarImagen(
            imagen,
            archivo,
            respaldo
        );
    });

    crearTachos();
    ajustarEscenario();
    prepararResiduos();
}

/* ==========================================================
   RESIDUOS
   ========================================================== */

function mezclar(lista) {
    const copia = [...lista];

    for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(
            Math.random() * (i + 1)
        );

        [copia[i], copia[j]] =
            [copia[j], copia[i]];
    }

    return copia;
}

function prepararResiduos() {
    const disponibles = tiposDisponibles();

    let anteriores = disponibles;

    if (
        nivel === "dificil" &&
        escenarioActual > 0
    ) {
        anteriores = ORDEN.slice(
            0,
            [4, 5, 6, 7, 7][escenarioActual - 1]
        );
    }

    const nuevos = disponibles.filter(
        tipo => !anteriores.includes(tipo)
    );

    let tipos = [
        ...nuevos,

        ...mezclar(
            disponibles.filter(
                tipo => !nuevos.includes(tipo)
            )
        )
    ];

    while (
        tipos.length < residuosPorEscenario()
    ) {
        tipos.push(...mezclar(disponibles));
    }

    cola = tipos
        .slice(0, residuosPorEscenario())
        .map(tipo => {
            const opciones = RESIDUOS.filter(
                residuo => residuo.tipo === tipo
            );

            return opciones[
                Math.floor(
                    Math.random() * opciones.length
                )
            ];
        });
}

function siguienteResiduo() {
    if (!activo) return;

    residuoActual =
        cola[completadosEscenario];

    $("residuo-respaldo").textContent =
        residuoActual.emoji;

    cargarImagen(
        $("imagen-residuo"),
        residuoActual.archivo,
        $("residuo-respaldo")
    );

    bloquear(false);
}

/* ==========================================================
   RESPUESTA, VIDAS Y MOVIMIENTO
   ========================================================== */

async function responder(boton, tipo) {
    if (
        !activo ||
        bloqueado ||
        !residuoActual
    ) {
        return;
    }

    const sesionActual = sesion;

    bloquear(true);

    const correcto =
        tipo === residuoActual.tipo;

    boton.classList.add(
        correcto ? "correcto" : "incorrecto"
    );

    /* INCORRECTO */

    if (!correcto) {
        vidas--;

        tono(180);
        actualizarIndicadores();

        mostrarMensaje(
            vidas > 0
                ? "¡Inténtalo con otro tacho! Has perdido una vida."
                : "Se terminaron las vidas.",
            true
        );

        await esperar(420);

        if (sesionActual !== sesion) return;

        boton.classList.remove("incorrecto");

        if (vidas === 0) {
            terminar(false);
            return;
        }

        bloquear(false);
        return;
    }

    /* CORRECTO */

    puntos += 10;

    completados++;
    completadosEscenario++;

    residuoActual = null;

    tono(880);
    actualizarIndicadores();

    mostrarMensaje(
        "¡Muy bien! 🚛 Seguimos avanzando."
    );

    $("camion").classList.add("andando");

    posicionarCasas(true);

    await esperar(760);

    if (sesionActual !== sesion) return;

    $("camion").classList.remove("andando");

    boton.classList.remove("correcto");

    /* ÚLTIMA CASA */

    if (
        completadosEscenario >=
        residuosPorEscenario()
    ) {
        mostrarMensaje(
            "¡Llegamos a la última casa! 🌟"
        );

        await esperar(650);

        if (sesionActual !== sesion) return;

        if (
            escenarioActual ===
            ESCENARIOS.length - 1
        ) {
            terminar(true);
            return;
        }

        escenarioActual++;
        completadosEscenario = 0;

        prepararEscenario();

        mostrarMensaje(
            nivel === "dificil"
                ? `¡Nuevo escenario! Ahora hay ${cantidadTachos()} tachos, sin referencias.`
                : "¡Nuevo escenario! Continuamos reciclando."
        );
    }

    siguienteResiduo();
}

/* ==========================================================
   INICIAR Y REINICIAR
   ========================================================== */

function iniciar() {
    sesion++;

    puntos = 0;
    vidas = 3;

    escenarioActual = 0;
    completados = 0;
    completadosEscenario = 0;

    residuoActual = null;

    activo = true;
    bloqueado = true;

    $("menu").classList.add("oculto");
    $("final").classList.add("oculto");

    $("camion").classList.remove("andando");

    actualizarIndicadores();
    prepararEscenario();
    siguienteResiduo();

    mostrarMensaje(
        "Elige el tacho correcto. ¡Tienes tres vidas!"
    );
}

function volverMenu() {
    sesion++;

    activo = false;
    residuoActual = null;

    bloquear(true);

    $("camion").classList.remove("andando");

    $("final").classList.add("oculto");
    $("menu").classList.remove("oculto");

    $("boton-iniciar").focus();
}

/* ==========================================================
   FINAL
   ========================================================== */

function terminar(gano) {
    activo = false;
    residuoActual = null;

    bloquear(true);

    $("icono-final").textContent =
        gano ? "🏆" : "🌱";

    $("titulo-final").textContent = gano
        ? "¡Misión cumplida!"
        : "¡Vamos a intentarlo otra vez!";

    $("texto-final").textContent = gano
        ? "Completaste los cinco escenarios y ayudaste a cuidar el planeta."
        : "Se acabaron tus tres vidas. Puedes volver a jugar y seguir aprendiendo.";

    $("resultado").textContent =
        `${puntos} puntos · ` +
        `${completados}/${NIVELES[nivel].total} residuos`;

    $("final").classList.remove("oculto");

    $("boton-reiniciar").focus();
}

/* ==========================================================
   BOTONES
   ========================================================== */

document.querySelectorAll(".nivel").forEach(
    boton => {
        boton.onclick = () => {
            nivel = boton.dataset.nivel;

            document.querySelectorAll(".nivel").forEach(
                otro => {
                    otro.classList.toggle(
                        "activo",
                        otro === boton
                    );

                    otro.setAttribute(
                        "aria-pressed",
                        String(otro === boton)
                    );
                }
            );
        };
    }
);

$("boton-iniciar").onclick = iniciar;
$("boton-reiniciar").onclick = iniciar;

$("boton-menu").onclick = volverMenu;
$("boton-final-menu").onclick = volverMenu;

$("boton-sonido").onclick = () => {
    sonido = !sonido;

    $("boton-sonido").textContent =
        sonido ? "🔊" : "🔇";

    $("boton-sonido").setAttribute(
        "aria-label",
        sonido
            ? "Silenciar sonido"
            : "Activar sonido"
    );

    tono(660);
};

window.addEventListener(
    "resize",
    ajustarEscenario
);

/* VISTA INICIAL */

cargarCamion();
prepararEscenario();
actualizarIndicadores();
bloquear(true);

</script>
