<body data-theme="cyberpunk">
<header><h1>🐝 ROBOT BEE CONTROL</h1><p class="subtitle">¡Programa primero y observa cómo baila tu abeja!</p><label class="theme-picker">🎨 Diseño <select id="theme" aria-label="Seleccionar diseño"><option value="cyberpunk">💻 Cyberpunk</option><option value="infantil">🌈 Infantil</option><option value="jardin">🌼 Jardín mágico</option><option value="galaxia">🚀 Galaxia</option><option value="halloween">🎃 Halloween</option><option value="navidad">🎄 Navidad</option></select></label></header>
<main class="main"><section class="controls" aria-label="Programación"><div class="dpad"><button class="d-btn up command" data-command="up" aria-label="Avanzar"><img src="../assets/img_controlBe/Arriba.png" alt="↑" onerror="this.replaceWith(document.createTextNode('↑'))"></button><button class="d-btn left command" data-command="left" aria-label="Girar izquierda"><img src="../assets/img_controlBe/Izquierda.png" alt="↶" onerror="this.replaceWith(document.createTextNode('↶'))"></button><button class="d-btn go" id="go" aria-label="Ejecutar">▶<small>GO</small></button><button class="d-btn right command" data-command="right" aria-label="Girar derecha"><img src="../assets/img_controlBe/Derecha.png" alt="↷" onerror="this.replaceWith(document.createTextNode('↷'))"></button><button class="d-btn down command" data-command="down" aria-label="Retroceder"><img src="../assets/img_controlBe/Abajo.png" alt="↓" onerror="this.replaceWith(document.createTextNode('↓'))"></button></div><div class="actions"><button class="action pause" id="pause">⏸ PAUSA</button><button class="action undo" id="undo">↶ DESHACER</button><button class="action clear" id="clear">✕ BORRAR</button></div><div class="sequence-box"><div class="sequence-title">Secuencia programada · <span id="count">0</span> pasos</div><div class="sequence" id="sequence"></div><div class="msg" id="msg" role="status" aria-live="polite">Agrega instrucciones y presiona GO.</div></div><div class="hint">↑ Avanzar · ↓ Retroceder · ↶/↷ Girar 90°</div></section><section class="arena" aria-label="Pista de la abeja"><div class="board" id="board"><div class="bee-position" id="bee-position"><div class="bee-rotation" id="bee-rotation"><div class="bee" id="bee"><div class="wing left"></div><div class="wing right"></div><div class="antenna left"></div><div class="antenna right"></div><div class="bee-body"><div class="visor"><div class="eye"></div><div class="eye"></div></div><div class="stripes"></div><div class="engine"></div><div class="cheek left"></div><div class="cheek right"></div></div><div class="bee-hat"></div><div class="bee-badge"></div><div class="bee-scarf"></div><div class="bee-helmet"></div></div></div></div></div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const paths={up:'../assets/img_controlBe/Arriba.png',down:'../assets/img_controlBe/Abajo.png',left:'../assets/img_controlBe/Izquierda.png',right:'../assets/img_controlBe/Derecha.png'};
const names={up:'Avanzar',down:'Retroceder',left:'Girar a la izquierda',right:'Girar a la derecha'};
const phrases={up:'Un paso adelante.',down:'Un paso hacia atrás.',left:'Giro de noventa grados a la izquierda.',right:'Giro de noventa grados a la derecha.'};
const state={steps:[],running:false,paused:false,token:0,index:-1,x:0,y:0,angle:0};
let voices=[];const voiceSupported='speechSynthesis' in window;
function refreshVoices(){if(voiceSupported)voices=speechSynthesis.getVoices()}
if(voiceSupported){refreshVoices();speechSynthesis.addEventListener('voiceschanged',refreshVoices)}
function speak(text,token){return new Promise(resolve=>{if(!voiceSupported||token!==state.token){resolve();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.95;u.pitch=.75;u.volume=1;u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('es'))||null;let done=false;const finish=()=>{if(done)return;done=true;$('bee').classList.remove('speaking');resolve()};u.onstart=()=>{$('bee').classList.add('speaking')};u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);setTimeout(finish,Math.max(1800,text.length*150))})}
function renderSteps(){const el=$('sequence');el.replaceChildren();$('count').textContent=state.steps.length;state.steps.forEach((step,i)=>{const tag=document.createElement('span');tag.className='step'+(state.running&&state.index===i?' active':'');const img=document.createElement('img');img.src=paths[step];img.alt=step;img.onerror=()=>img.replaceWith(document.createTextNode(({up:'↑',down:'↓',left:'↶',right:'↷'})[step]));tag.append(img,document.createTextNode(String(i+1)));el.append(tag)});el.querySelector('.active')?.scrollIntoView({block:'nearest',inline:'nearest'})}
function message(text){$('msg').textContent=text}
function updateBee(instant=false){const p=$('bee-position'),r=$('bee-rotation');if(instant){p.style.transition='none';r.style.transition='none'}p.style.left=(50+state.x*20)+'%';p.style.top=(50+state.y*20)+'%';r.style.transform=`rotate(${state.angle}deg)`;if(instant){void p.offsetWidth;requestAnimationFrame(()=>{p.style.transition='';r.style.transition=''})}}
function stepMotion(step){const dir=((state.angle%360)+360)%360;if(step==='left')state.angle-=90;else if(step==='right')state.angle+=90;else{const sign=step==='up'?1:-1;const dx=dir===90?1:dir===270?-1:0;const dy=dir===0?-1:dir===180?1:0;const x=state.x+dx*sign,y=state.y+dy*sign;if(Math.abs(x)>2||Math.abs(y)>2){message('⚠️ La abeja llegó al borde de la pista.');return false}state.x=x;state.y=y}updateBee();return true}
function delay(ms,token){return new Promise(resolve=>{let elapsed=0;const tick=()=>{if(token!==state.token){resolve(false);return}if(!state.paused)elapsed+=40;if(elapsed>=ms){resolve(true);return}setTimeout(tick,40)};setTimeout(tick,40)})}
async function waitUnpaused(token){while(state.paused&&token===state.token)await new Promise(r=>setTimeout(r,60));return token===state.token}
function buttons(){document.querySelectorAll('.command').forEach(b=>b.disabled=state.running);$('go').disabled=state.running;$('undo').disabled=state.running;$('pause').disabled=!state.running;$('pause').textContent=state.paused?'▶ CONTINUAR':'⏸ PAUSA'}
function resetPosition(){state.x=0;state.y=0;state.angle=0;updateBee(true)}
function addStep(s){if(state.running)return;if(state.steps.length>=60){message('Máximo 60 instrucciones.');return}state.steps.push(s);renderSteps();message('Instrucción agregada: '+names[s]+'. La abeja espera GO.')}
async function execute(){if(state.running)return;if(!state.steps.length){message('Primero agrega una instrucción.');return}state.token++;const token=state.token;state.running=true;state.paused=false;state.index=-1;resetPosition();buttons();message('🐝 Ejecutando programa...');await delay(180,token);for(let i=0;i<state.steps.length;i++){if(!await waitUnpaused(token))break;state.index=i;renderSteps();const s=state.steps[i];const moved=stepMotion(s);if(!moved){await speak('He llegado al borde de la pista.',token);if(token!==state.token)break;continue}const spoken=speak(phrases[s],token);await delay(720,token);await spoken;if(!await waitUnpaused(token))break;await delay(180,token)}if(token!==state.token)return;state.running=false;state.paused=false;state.index=-1;buttons();renderSteps();message('🎉 ¡Secuencia completada! Puedes programar otra vez.')}
function clear(){state.token++;state.running=false;state.paused=false;state.index=-1;state.steps=[];if(voiceSupported)speechSynthesis.cancel();$('bee').classList.remove('speaking');resetPosition();renderSteps();buttons();message('Programa borrado. ¡Comienza otra aventura!')}
$('board').insertAdjacentHTML('afterbegin',Array.from({length:25},(_,i)=>`<div class="cell${i===12?' center':''}"></div>`).join(''));
document.querySelectorAll('.command').forEach(b=>b.addEventListener('click',()=>addStep(b.dataset.command)));
$('go').addEventListener('click',execute);$('clear').addEventListener('click',clear);$('undo').addEventListener('click',()=>{if(state.running)return;state.steps.pop();renderSteps();message('Última instrucción eliminada.')});$('pause').addEventListener('click',()=>{if(!state.running)return;state.paused=!state.paused;buttons();message(state.paused?'⏸ Pausado: terminará la instrucción actual.':'▶ Continuando programa...')});$('theme').addEventListener('change',e=>document.body.dataset.theme=e.target.value);
buttons();resetPosition();renderSteps();

// Ajusta la pista y el mando al alto visible real, incluyendo móviles con barra del navegador.
function fitBeeScreen(){
 const root=document.documentElement;
 if(window.innerWidth>760){root.style.removeProperty('--bee-board-size');root.style.removeProperty('--bee-button-size');return;}
 const vh=window.visualViewport?.height||window.innerHeight;
 const header=document.querySelector('header');
 const main=document.querySelector('.main');
 const arena=document.querySelector('.arena');
 const controls=document.querySelector('.controls');
 const board=document.querySelector('.board');
 const dpad=document.querySelector('.dpad');
 // Medir sin dependencia circular del tamaño calculado previamente.
 const available=vh - header.getBoundingClientRect().height - 36;
 const horizontal=Math.max(140,Math.min(window.innerWidth-55,380));
 const compact=vh<700;
 const button=Math.max(34,Math.min(64,Math.floor((available-(compact?128:166))/5.7)));
 root.style.setProperty('--bee-button-size',button+'px');
 const controlHeight=controls.getBoundingClientRect().height;
 const arenaExtras=arena.getBoundingClientRect().height-board.getBoundingClientRect().height;
 const mainExtras=main.getBoundingClientRect().height-arena.getBoundingClientRect().height-controlHeight;
 const maxBoard=Math.max(115,Math.floor(available-controlHeight-arenaExtras-mainExtras));
 root.style.setProperty('--bee-board-size',Math.min(horizontal,maxBoard)+'px');
}
let fitFrame=0;
function scheduleBeeFit(){cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(fitBeeScreen)}
window.addEventListener('resize',scheduleBeeFit);
window.visualViewport?.addEventListener('resize',scheduleBeeFit);
window.addEventListener('orientationchange',scheduleBeeFit);
window.addEventListener('load',scheduleBeeFit);
scheduleBeeFit();

</script>
</body></html>
