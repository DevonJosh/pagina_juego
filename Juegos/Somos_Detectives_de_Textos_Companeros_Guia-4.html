function total(){return Object.values(saved.scores).reduce((a,b)=>a+b,0)}
function home(){stopBoardFit();document.body.classList.remove('playing');stopTyping();stopNarration();game=null;lock=false;app.innerHTML=`<section class="hq-banner"><div class="hq-cover">${customCovers.home?coverImg('home'):defaultCover('home')}</div><div class="hq-title"><div class="eyebrow">Cuartel de pequeños lectores</div><h1>Somos detectives<br>de <em>textos</em></h1><p>¡La ciudad necesita tus superpoderes de lectura!</p><button class="primary" onclick="start('match')">▶ Comenzar aventura</button></div><button class="cover-edit" onclick="openStudio('covers')" aria-label="Cambiar portada principal">🖼 Cambiar portada</button></section><section class="hq-layout"><aside class="companion-home"><span class="eyebrow">Tu compañero guía</span><div class="portrait">${guideArt()}</div><h2>${guideName()}</h2><div class="guide-bubble">¡Hola, detective! Te acompañaré y explicaré cada misión. ¿Cuál investigamos primero?</div><button class="secondary" onclick="openStudio('guides')">Elegir compañero</button><div class="home-score">⭐ ${total()} / 18 estrellas</div><p class="muted">Sin prisa, sin perder vidas.<br>¡Cada intento te ayuda a aprender!</p></aside><div class="mission-board"><div class="board-heading"><div><span class="eyebrow">Tablero de investigación</span><h2>6 casos por resolver</h2></div><span class="board-pin">34 palabras</span></div><div class="missions">${MODES.map((m,i)=>`<button class="mission-row" style="--mission:${['#f9d06a','#a3d5ba','#b9b3ed','#eba4a0','#8bc9de','#f8d878'][i]}" onclick="start('${m.id}')"><div class="mission-cover">${customCovers[m.id]?coverImg(m.id):defaultCover(m.id)}<span class="case-number">0${i+1}</span></div><div class="mission-info"><span class="mission-label">EXPEDIENTE ${i+1}</span><h3>${m.title}</h3><p>${m.desc}</p><div class="mission-status">${saved.scores[m.id]?'★'.repeat(saved.scores[m.id])+' · Caso completado':'6 retos · Listo para investigar'}</div></div><span class="mission-go">➜</span></button>`).join('')}</div></div></section><footer>Voz automática al iniciar cada juego · PNG y música personalizables · Progreso en este navegador</footer>`}

function start(id){unlockEffects();startBackgroundMusic();const m=MODES.find(m=>m.id===id);game={mode:m,round:0,errors:0,points:0,words:shuffle(DATA.filter(d=>id!=='syllables'||d.s.length>1)).slice(0,6)};if(id==='initial')game.words=[DATA.find(d=>d.w==='mamá'),...shuffle(DATA.filter(d=>d.w!=='mamá')).slice(0,5)];round();showGuideIntro()}
function base(instruction,inner){document.body.classList.add('playing');stopTyping();stopNarration();const m=game.mode;app.innerHTML=`<div class="game-top"><button class="secondary" onclick="home()">← Casos</button><div class="progress" aria-label="Reto ${game.round+1} de 6">${Array.from({length:6},(_,i)=>`<span class="${i<game.round?'done':i===game.round?'current':''}"></span>`).join('')}</div><span class="muted">Reto ${game.round+1} de 6</span></div><div class="detective-desk"><section class="game-shell" style="--gamebg:${m.bg}"><div class="game-heading"><div><div class="eyebrow">${m.title}</div><h2>${instruction.title}</h2><p>Tu compañero te explica el reto abajo.</p></div><button class="pill" onclick="repeatInstruction()" aria-label="Escuchar instrucción">🔊</button></div><div class="workspace mode-${m.id}">${inner}</div><div class="feedback" id="feedback" role="status" aria-live="polite">${instruction.tip}</div></section></div>${guidePanel(instruction.text)}`;game.instruction=instruction.text+(m.id==='clues'?' '+game.d.clue:m.id!=='match'?' La palabra es: '+game.d.w:'');if(game.round===0)guideMessage(game.instruction);else roundComment();setupBoardFit()}
function repeatInstruction(){speak(game.instruction,true,'instruction')}
function target(d,reveal=false){return `<div class="target"><div class="picture">${svg(d.art)}</div><div>${reveal?`<div class="word">${d.w.toUpperCase()}</div>`:''}<button class="pill" onclick="speak('${d.w}',true)">🔊 Escuchar palabra</button><div class="hint" style="margin-top:10px">${reveal?'Sigue las letras en este orden.':'Mira la imagen. ¿Qué palabra formarás?'}</div></div></div>`}
function round(){lock=false;game.d=game.words[game.round];game.selected=[];const d=game.d,id=game.mode.id;if(id==='match'){const seen=new Set([d.art]);game.matchWords=shuffle(DATA.filter(x=>x.w!==d.w)).filter(x=>{if(seen.has(x.art))return false;seen.add(x.art);return true}).slice(0,2).concat(d);game.matched=[];game.left=null;game.right=null;const left=shuffle(game.matchWords),right=derangeWords(left);game.matchLeft=left.map(x=>x.w);game.matchRight=right.map(x=>x.w);base({title:'Cada imagen tiene una palabra',text:'Toca una imagen y luego la palabra que le corresponde. Encuentra las tres parejas.',tip:'⌕ Observa las imágenes y lee con calma.'},`<div class="match"><div class="match-col">${left.map(x=>`<button class="match-card" data-side="left" data-word="${x.w}" onclick="pickMatch('left','${x.w}',this)" aria-label="Seleccionar imagen">${svg(x.art)}</button>`).join('')}</div><div class="match-col">${right.map(x=>`<button class="match-card" data-side="right" data-word="${x.w}" onclick="pickMatch('right','${x.w}',this)">${x.w}</button>`).join('')}</div></div>`)}else if(id==='path'){game.path=generatePath(d.w);game.selected=[];base({title:'¡Construye el camino!',text:'Empieza en la casilla marcada con inicio. Toca o arrastra por letras vecinas, sin diagonales, para formar la palabra.',tip:'⌕ Sigue la palabra de arriba. Puedes borrar y volver a empezar.'},`${target(d,true)}<div class="path-wrap"><div class="grid" id="grid">${game.path.grid.map((l,i)=>`<button class="tile" data-index="${i}" onclick="if(event.detail===0)pathClick(${i})" aria-label="Letra ${l}${i===game.path.route[0]?', inicio':''}">${l}${i===game.path.route[0]?'<small>INICIO</small>':''}</button>`).join('')}</div><div class="path-word" id="pathWord"></div></div><div class="actions"><button class="secondary" onclick="resetPath()">↶ Borrar camino</button></div>`);renderPath();setupDrag()}else if(id==='letters'||id==='syllables'){const chunks=id==='letters'?[...d.w]:d.s;game.chunks=shuffle(chunks.map((c,i)=>({c,i})));if(game.chunks.map(x=>x.c).join('')===d.w)game.chunks.reverse();base({title:id==='letters'?'Las letras están revueltas':'Junta las sílabas',text:id==='letters'?'Toca las letras en orden para escribir la palabra de la imagen. Después pulsa comprobar.':'Escucha la palabra. Toca las sílabas en orden y pulsa comprobar.',tip:'⌕ Puedes tocar una pieza colocada para devolverla.'},`${target(d)}<div class="path-word" id="slots"></div><div class="letter-bank">${game.chunks.map((x,i)=>`<button class="letter" id="piece${i}" onclick="pickPiece(${i})">${x.c}</button>`).join('')}</div><div class="actions"><button class="secondary" onclick="clearPieces()">↶ Borrar</button><button class="primary" onclick="checkPieces()">Comprobar ✓</button></div>`);renderPieces()}else if(id==='initial'){game.correctInitial=firstLetter(d.w);game.initialOptions=shuffle([game.correctInitial,...shuffle([...'AEIOUMPSLRTBCDFGN'].filter(l=>l!==game.correctInitial)).slice(0,3)]);base({title:'¿Con qué letra empieza?',text:'Escucha la palabra '+d.w+'. Mira cómo se escribe y elige su primera letra.',tip:'⌕ Escucha el comienzo de la palabra y elige una letra.'},`<div class="initial-card"><div class="initial-visual"><div class="picture">${svg(d.art)}</div><div class="initial-word">${d.w}</div><button class="pill" onclick="speak(game.d.w,true,'instruction')">🔊 Escuchar palabra</button></div><div class="initial-prompt">¿Cuál es la primera letra de <strong>${d.w}</strong>?</div><div class="answers">${game.initialOptions.map(l=>`<button class="answer" onclick="initialAnswer('${l}',this)">${l}</button>`).join('')}</div></div>`)}else{game.options=shuffle([d,...shuffle(DATA.filter(x=>x.w!==d.w)).slice(0,2)]);base({title:'Un misterio por resolver',text:'Lee o escucha la adivinanza. Elige la palabra que responde a la pista.',tip:'⌕ Escucha con atención y piensa en lo que dice la pista.'},`<div class="clue"><div class="question">🔎</div>${d.clue}<div style="margin-top:15px"><button class="pill" onclick="speak(game.d.clue,true)">🔊 Escuchar pista</button></div></div><div class="answers">${game.options.map(x=>`<button class="answer" onclick="answer('${x.w}',this)">${x.w}</button>`).join('')}</div>`)}}
function feedback(text,bad=false){const e=document.getElementById('feedback');e.className='feedback '+(bad?'bad':'');e.textContent=text;guideMessage(text);if(bad){game.errors++;sound(false)}}
function success(){if(lock)return;lock=true;game.points+=10;const id=game.mode.id;saved.rounds[id]=Math.max(saved.rounds[id]||0,game.round+1);save();stopNarration();sound(true);guideMessage(['¡Lo lograste! Vamos al siguiente reto.','¡Qué buena investigación! Encontraste la respuesta.','¡Bien hecho! Cada palabra es un nuevo descubrimiento.','¡Tu atención dio resultado! Seguimos explorando.'][game.round%4]);const e=document.getElementById('feedback');e.className='feedback good';e.innerHTML=`<span>✓ ¡Caso resuelto! ${id==='match'?'Encontraste las tres parejas.':`Descubriste <strong>${game.d.w}</strong>.`}</span><button class="primary" onclick="next()">${game.round===5?'Ver recompensa':'Siguiente →'}</button>`;confetti(16)}
function next(){if(!lock)return;game.round++;if(game.round===6)finish();else round()}
function pickMatch(side,w,el){if(lock||game.matched.includes(w))return;document.querySelectorAll(`[data-side="${side}"]`).forEach(e=>e.classList.remove('selected'));el.classList.add('selected');game[side]=w;if(game.left&&game.right){if(game.left===game.right){const found=game.left;game.matched.push(found);document.querySelectorAll(`[data-word="${found}"]`).forEach(e=>{e.classList.remove('selected');e.classList.add('matched');e.disabled=true});game.left=game.right=null;speak(found);sound(true);if(game.matched.length===3)success();else feedback('✓ ¡Encontraste una pareja! Busca las que faltan.')}else{feedback('Esa pareja todavía no coincide. Mira la imagen y prueba otra palabra.',true);game.left=game.right=null;document.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'))}}}
function adjacent(a,b){return Math.abs(Math.floor(a/4)-Math.floor(b/4))+Math.abs(a%4-b%4)===1}
function generatePath(w){let route=[Math.floor(Math.random()*16)];while(route.length<w.length){let last=route.at(-1),options=Array.from({length:16},(_,i)=>i).filter(i=>!route.includes(i)&&adjacent(i,last));if(!options.length){route=[Math.floor(Math.random()*16)];continue}route.push(shuffle(options)[0])}const distractors=[...'aeioumpslnrtbcdfg'].filter(l=>!w.includes(l));let grid=Array.from({length:16},()=>shuffle(distractors)[0]);route.forEach((p,i)=>grid[p]=w[i].toUpperCase());return {route,grid:grid.map(l=>l.toUpperCase())}}
function pathClick(i){if(lock)return;const selected=game.selected,grid=game.path.grid;if(selected.at(-1)===i)return;if(selected.length&&i===selected.at(-2)){selected.pop();renderPath();return}if(!selected.length&&i!==game.path.route[0]){feedback('Empieza en la casilla que dice INICIO.',true);return}if(selected.includes(i)||selected.length&&!adjacent(i,selected.at(-1))){feedback('El camino sigue por casillas vecinas: arriba, abajo, izquierda o derecha.',true);return}if(grid[i].toLowerCase()!==game.d.w[selected.length]){feedback(`Busca la letra ${game.d.w[selected.length].toUpperCase()} en una casilla vecina.`,true);return}selected.push(i);renderPath();if(selected.length===game.d.w.length)success()}
function renderPath(){document.querySelectorAll('.tile').forEach((e,i)=>e.classList.toggle('path',game.selected.includes(i)));document.getElementById('pathWord').innerHTML=[...game.d.w].map((l,i)=>`<span class="slot ${game.selected.length>i?'filled':''}">${game.selected.length>i?l.toUpperCase():'·'}</span>`).join('')}
function resetPath(){if(lock)return;game.selected=[];renderPath();feedback('⌕ Empieza en INICIO y sigue las letras.')}
function setupDrag(){const grid=document.getElementById('grid');let dragging=false,last=-1;grid.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-index]');if(!b)return;e.preventDefault();dragging=true;last=+b.dataset.index;pathClick(last)});grid.addEventListener('pointermove',e=>{if(!dragging)return;e.preventDefault();const b=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-index]');if(b&&+b.dataset.index!==last){last=+b.dataset.index;pathClick(last)}});window.addEventListener('pointerup',()=>dragging=false,{once:true});grid.addEventListener('pointerup',()=>dragging=false);grid.addEventListener('pointercancel',()=>dragging=false);grid.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')dragging=false})}
function renderPieces(){const n=game.mode.id==='letters'?game.d.w.length:game.d.s.length;document.getElementById('slots').innerHTML=Array.from({length:n},(_,i)=>{const p=game.selected[i];return `<button class="slot ${p!==undefined?'filled':''}" ${p===undefined?'disabled':''} onclick="removePiece(${i})" aria-label="Devolver pieza">${p!==undefined?game.chunks[p].c:'·'}</button>`}).join('');game.chunks.forEach((c,i)=>document.getElementById('piece'+i).disabled=game.selected.includes(i)||lock)}
function pickPiece(i){if(lock)return;game.selected.push(i);renderPieces()}
function removePiece(i){if(lock)return;game.selected.splice(i,1);renderPieces()}
function clearPieces(){if(lock)return;game.selected=[];renderPieces();feedback('⌕ Escucha la palabra y ordena las piezas.')}
function checkPieces(){if(lock)return;const assembled=game.selected.map(i=>game.chunks[i].c).join('');if(assembled===game.d.w){success();renderPieces()}else if(game.selected.length<game.chunks.length){feedback('Todavía faltan piezas. Coloca todas antes de comprobar.',true)}else{let n=0;const expected=game.mode.id==='letters'?[...game.d.w]:game.d.s;while(n<expected.length&&game.chunks[game.selected[n]].c===expected[n])n++;feedback(`Vamos a revisar. La pieza ${n+1} debe ser «${expected[n]}». Toca una pieza para cambiarla.`,true)}}
function answer(w,el){if(lock)return;if(w===game.d.w){el.classList.add('matched');success()}else{el.disabled=true;el.style.opacity='.4';feedback(`Prueba otra palabra. Una pista más: empieza con «${game.d.s[0]}».`,true)}}
function confetti(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<n;i++){const e=document.createElement('i');e.className='confetti';e.style.cssText=`left:${Math.random()*100}%;background:${['#ffd56b','#9adac0','#a790ed','#f48272'][i%4]};animation-delay:${Math.random()*.3}s`;document.body.append(e);setTimeout(()=>e.remove(),1900)}}
function finish(){stopBoardFit();document.body.classList.remove('playing');stopTyping();const m=game.mode,stars=game.errors<=2?3:game.errors<=6?2:1;saved.scores[m.id]=Math.max(saved.scores[m.id]||0,stars);saved.rounds[m.id]=6;save();speak(`¡Felicidades! Ganaste la insignia ${m.badge}.`,false,'success');app.innerHTML=`<section class="game-shell result"><span class="big-badge">🏅</span><div class="eyebrow" style="justify-content:center;margin-top:20px">Misión completada</div><h2>¡Eres ${m.badge.toLowerCase()}!</h2><div class="stars" aria-label="${stars} estrellas">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>Resolviste los seis retos de <strong>${m.title.toLowerCase()}</strong>. Cada palabra descubierta es una nueva herramienta para leer el mundo.</p><div class="stats"><div class="stat"><strong>6 / 6</strong>Retos resueltos</div><div class="stat"><strong>${game.points}</strong>Puntos del caso</div></div><p class="muted">${stars<3?'Puedes volver a jugar para ganar más estrellas. ¡Tu mejor resultado se conserva!':'¡Una investigación brillante! Explora los demás casos.'}</p><div class="actions"><button class="primary" onclick="home()">Elegir otro caso →</button><button class="secondary" onclick="start('${m.id}')">Volver a jugar</button></div></section>`;confetti(35)}

let mediaDB=null;const customImages={};const music=new Audio();music.loop=true;let musicRecord=null,musicURL=null,volume=.25,studioWord='mano',mediaReady=false;
function svg(type){const d=DATA.find(d=>d.art===type);const custom=d&&customImages[d.w];return custom?`<img src="${custom.url}" alt="${d.w}" onerror="imageFallback(this,'${type}')">`:defaultSvg(type)}
function imageFallback(img,type){img.outerHTML=defaultSvg(type)}
function dbOpen(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(Error('Tu navegador no permite guardar archivos.'));return}const r=indexedDB.open('detectivesMedia',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbWrite(record,remove=false){return new Promise((resolve,reject)=>{if(!mediaDB){reject(Error('El almacenamiento de archivos no está disponible.'));return}const t=mediaDB.transaction('files','readwrite');const store=t.objectStore('files');if(remove)store.delete(record.id);else store.put(record);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('No se pudo guardar el archivo.'))})}
async function loadMedia(){try{mediaDB=await dbOpen();const records=await new Promise((resolve,reject)=>{const r=mediaDB.transaction('files').objectStore('files').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});records.forEach(r=>{if(r.id.startsWith('cover:')){customCovers[r.id.slice(6)]={url:URL.createObjectURL(r.blob),name:r.name}}else if(r.id==='music'){musicRecord=r;musicURL=URL.createObjectURL(r.blob);music.src=musicURL}else if(r.id==='volume'){volume=r.value;music.volume=volume}else if(r.id.startsWith('image:'))customImages[r.id.slice(6)]={url:URL.createObjectURL(r.blob),name:r.name}});mediaReady=true;if(!game)home();updateMusicButton()}catch(e){mediaReady=true;console.warn('Archivos personalizados no disponibles');}}
function duckMusic(duck){music.volume=duck?volume*.2:volume}
function updateMusicButton(){const b=document.getElementById('musicBtn');b.textContent=!music.paused?'Ⅱ Música':'♫ Música';b.classList.toggle('active',!music.paused);b.setAttribute('aria-pressed',!music.paused)}
async function toggleMusic(){if(!musicRecord){openStudio('music');return}if(music.paused){try{saved.musicEnabled=true;save();duckMusic(narrationBusy);await music.play()}catch(e){statusMedia('Pulsa reproducir o elige otro MP3 compatible.')}}else{saved.musicEnabled=false;save();music.pause()}updateMusicButton()}
function statusMedia(msg){const e=document.getElementById('mediaStatus');if(e)e.textContent=msg}
function openStudio(tab='images'){completeDialogue();stopNarration();if(tab==='covers'||tab==='guides'){openDesignStudio(tab);return}const dialog=document.getElementById('dialog');dialog.innerHTML=`<h2>Tu taller de detective</h2><p class="media-detail">Cambia los dibujos y el ambiente musical a tu gusto. Cada imagen es opcional: las palabras sin PNG conservan su dibujo incluido. Los cambios se guardan solo en este navegador y dispositivo.</p><div class="studio-tabs"><button class="pill" onclick="openStudio('covers')">Portadas</button><button class="pill" onclick="openStudio('guides')">Compañeros guía</button><button class="pill ${tab==='images'?'active':''}" onclick="openStudio('images')">🖼 Imágenes</button><button class="pill ${tab==='music'?'active':''}" onclick="openStudio('music')">♫ Música de fondo</button></div>${tab==='images'?`<section class="studio-card"><h3>Elige la palabra que quieres ilustrar</h3><label for="studioWord" class="media-detail">Palabra</label><select id="studioWord" onchange="studioWord=this.value;renderStudioPreview()">${[...DATA].sort((a,b)=>a.w.localeCompare(b.w,'es')).map(d=>`<option value="${d.w}" ${d.w===studioWord?'selected':''}>${d.w}${customImages[d.w]?' · PNG personalizado':''}</option>`).join('')}</select><div class="studio-preview" id="studioPreview"></div><div id="imageNote" class="media-detail"></div><div class="actions"><label class="upload-label">Elegir imagen PNG<input class="file-input" type="file" accept="image/png,.png" onchange="uploadImage(this.files[0]);this.value=''" aria-label="Cargar imagen PNG"></label><button class="secondary" onclick="removeImage()">Restaurar dibujo</button></div><p class="media-detail">PNG de hasta 8 MB. Los fondos transparentes se ven mejor. La misma imagen aparecerá en todos los juegos que usan esta palabra.</p></section>`:`<section class="studio-card"><h3>Música de fondo</h3><p class="music-name" id="musicName"></p><div class="actions"><label class="upload-label">Elegir música<input class="file-input" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a" onchange="uploadMusic(this.files[0]);this.value=''" aria-label="Cargar música"></label><button class="secondary" onclick="toggleMusic()">▶ / Ⅱ Reproducir o pausar</button><button class="secondary" onclick="removeMusic()">Quitar música</button></div><label class="volume-row">Volumen<input type="range" min="0" max="100" value="${Math.round(volume*100)}" oninput="setVolume(this.value)" onchange="saveVolume()"><output id="volumeValue">${Math.round(volume*100)}%</output></label><p class="media-detail">MP3, WAV, OGG o un audio compatible, hasta 30 MB. Se repite durante el juego. Al sonar la narración, la música baja de volumen. La música elegida arranca al entrar a un juego. Puedes pausarla desde el botón Música.</p><div class="music-integration"><strong>Tu MP3 como fondo fijo</strong><p>Elige tu audio y descarga una copia del juego que lo incluye. En esa copia no necesitarás cargarlo otra vez.</p><button class="primary" onclick="downloadWithMusic()">↓ Descargar juego con esta música</button></div></section>`}<div class="media-status" id="mediaStatus" role="status" aria-live="polite">${mediaReady?(mediaDB?'Tus archivos se guardarán en este navegador.':'No hay almacenamiento disponible para archivos en este navegador.'): 'Preparando el almacenamiento…'}</div><div class="actions"><button class="primary" onclick="closeStudio()">Volver a la aventura →</button></div>`;if(!dialog.open)dialog.showModal();if(tab==='images')renderStudioPreview();else renderMusicName()}
function renderStudioPreview(){const d=DATA.find(d=>d.w===studioWord);document.getElementById('studioPreview').innerHTML=svg(d.art);document.getElementById('imageNote').textContent=customImages[d.w]?'Usando tu PNG personalizado.':'Usando el dibujo incluido.'}
function closeStudio(){stopNarration();document.getElementById('dialog').close();if(!game)home();else document.querySelectorAll('.picture, .match-card[data-side="left"]').forEach(e=>{const d=e.classList.contains('picture')?game.d:DATA.find(d=>d.w===e.dataset.word);if(d)e.innerHTML=svg(d.art)});const portrait=document.getElementById('guidePortrait');if(portrait)portrait.innerHTML=guideArt();const name=document.getElementById('activeGuideName');if(name)name.textContent=guideName()}
async function uploadImage(file){if(!file)return;const word=studioWord;if(file.type!=='image/png'){statusMedia('Elige un archivo PNG.');return}if(file.size>8*1024*1024){statusMedia('El PNG supera los 8 MB. Elige uno más pequeño.');return}let url;try{url=URL.createObjectURL(file);await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(Error('No se pudo abrir ese PNG.'));img.src=url});await dbWrite({id:'image:'+word,blob:file,name:file.name});if(customImages[word])URL.revokeObjectURL(customImages[word].url);customImages[word]={url,name:file.name};url=null;renderStudioPreview();statusMedia('¡PNG guardado! La imagen aparecerá al jugar con '+word+'.')}catch(e){statusMedia(e.message||'No se pudo guardar la imagen. El dibujo incluido sigue disponible.')}finally{if(url)URL.revokeObjectURL(url)}}
async function removeImage(){const word=studioWord;try{await dbWrite({id:'image:'+word},true);if(customImages[word])URL.revokeObjectURL(customImages[word].url);delete customImages[word];renderStudioPreview();statusMedia('Dibujo incluido restaurado para '+word+'.')}catch(e){statusMedia('No se pudo restaurar el dibujo. Intenta otra vez.')}}
function renderMusicName(){const e=document.getElementById('musicName');if(e)e.textContent=musicRecord?'Audio elegido: '+musicRecord.name:'Todavía no has elegido música. Puedes jugar en silencio o cargar tu audio.'}
async function uploadMusic(file){if(!file)return;if(!file.type.startsWith('audio/')&&!/\.(mp3|wav|ogg|m4a)$/i.test(file.name)){statusMedia('Elige un archivo de audio.');return}if(file.size>30*1024*1024){statusMedia('El audio supera los 30 MB. Elige uno más pequeño.');return}let url;try{statusMedia('Comprobando audio…');url=URL.createObjectURL(file);await new Promise((resolve,reject)=>{const probe=new Audio();const timer=setTimeout(()=>{probe.src='';reject(Error('No se pudo comprobar el audio. Prueba con MP3.'))},10000);probe.onloadedmetadata=()=>{clearTimeout(timer);probe.src='';resolve()};probe.onerror=()=>{clearTimeout(timer);reject(Error('Este navegador no puede reproducir ese audio. Prueba con MP3.'))};probe.src=url});const record={id:'music',blob:file,name:file.name};await dbWrite(record);music.pause();if(musicURL)URL.revokeObjectURL(musicURL);musicURL=url;url=null;musicRecord=record;saved.musicEnabled=true;save();music.src=musicURL;music.volume=volume;renderMusicName();updateMusicButton();statusMedia('¡Música de fondo guardada! Sonará automáticamente al entrar a un juego. También puedes integrarla en un HTML descargable.')}catch(e){statusMedia(e.message||'No se pudo guardar el audio.')}finally{if(url)URL.revokeObjectURL(url)}}
async function removeMusic(){try{await dbWrite({id:'music'},true);music.pause();music.removeAttribute('src');music.load();if(musicURL)URL.revokeObjectURL(musicURL);musicURL=null;musicRecord=null;renderMusicName();updateMusicButton();statusMedia('Música eliminada. Puedes cargar otra cuando quieras.')}catch(e){statusMedia('No se pudo quitar la música. Intenta otra vez.')}}
function setVolume(value){volume=Math.max(0,Math.min(1,Number(value)/100));duckMusic(narrationBusy);const e=document.getElementById('volumeValue');if(e)e.textContent=Math.round(volume*100)+'%'}

let narrationEpoch=0,narrationBusy=false;const customCovers={};let coverKey='home';saved.guide=['luna','milo','tita'].includes(saved.guide)?saved.guide:'luna';
const GUIDE_NAMES={luna:'Luna, la detective',milo:'Milo, el robot',tita:'Tita, la búho'};
function guideName(){return GUIDE_NAMES[saved.guide]}
function guideArt(){const key='guide-'+saved.guide;if(customCovers[key])return coverImg(key);if(saved.guide==='luna')return mascot();if(saved.guide==='tita')return defaultSvg('owl');return `<svg viewBox="0 0 160 170" aria-hidden="true"><ellipse cx="80" cy="157" rx="51" ry="10" fill="#bcdbe3"/><path d="M45 151V125M114 151V125" stroke="#689aba" stroke-width="15" stroke-linecap="round"/><rect x="40" y="82" width="80" height="58" rx="22" fill="#effaff" stroke="#86b9ce" stroke-width="4"/><path d="M36 94L17 119M124 94L144 76" stroke="#86b9ce" stroke-width="13" stroke-linecap="round"/><rect x="25" y="27" width="110" height="68" rx="24" fill="#f4fcff" stroke="#86b9ce" stroke-width="4"/><rect x="36" y="37" width="88" height="45" rx="15" fill="#205273"/><ellipse cx="58" cy="57" rx="7" ry="10" fill="#7de6ed"/><ellipse cx="102" cy="57" rx="7" ry="10" fill="#7de6ed"/><path d="M70 71Q80 78 90 71" fill="none" stroke="#7de6ed" stroke-width="3"/><path d="M80 25V10" stroke="#86b9ce" stroke-width="5"/><circle cx="80" cy="8" r="7" fill="#ffcd60"/><path d="M72 108H88V124H72Z" fill="#ffcd60"/></svg>`}
function coverImg(key){return `<img src="${customCovers[key].url}" alt="${key.startsWith('guide')?'Compañero guía':'Portada personalizada'}" onerror="this.outerHTML=defaultCover('${key}')">`}
function defaultCover(key){if(key==='home')return `<svg class="city-art" viewBox="0 0 900 330" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="900" height="330" fill="#bce6ec"/><circle cx="730" cy="58" r="45" fill="#ffdf89"/><g fill="#fff" opacity=".8"><ellipse cx="185" cy="59" rx="82" ry="21"/><ellipse cx="479" cy="45" rx="65" ry="17"/></g><path d="M0 234Q230 127 390 210T900 159V330H0Z" fill="#90c5b2"/><path d="M0 269Q235 175 425 267T900 235V330H0Z" fill="#64a59a"/><g stroke="#7caea3" stroke-width="3"><path d="M550 139H648V299H550Z" fill="#f7dbad"/><path d="M535 140L600 90L665 140Z" fill="#e39c85"/><path d="M688 160H790V302H688Z" fill="#b7d7f0"/><path d="M677 161L739 111L802 161Z" fill="#8c90b9"/><path d="M824 132H917V296H824Z" fill="#efd9b9"/></g><g fill="#f7fbf8"><rect x="570" y="168" width="24" height="28" rx="5"/><rect x="610" y="168" width="24" height="28" rx="5"/><rect x="707" y="186" width="25" height="28" rx="5"/><rect x="750" y="186" width="25" height="28" rx="5"/></g><path d="M490 330Q534 266 676 266T900 290" stroke="#f6e7bc" stroke-width="40" fill="none"/><g font-family="Trebuchet MS" font-weight="bold" font-size="35"><rect x="475" y="193" width="47" height="52" rx="8" fill="#fff7d5" transform="rotate(-10 500 218)"/><text x="487" y="230" fill="#527d9c">A</text><rect x="812" y="205" width="47" height="52" rx="8" fill="#fff7d5" transform="rotate(12 830 230)"/><text x="822" y="243" fill="#c38466">m</text></g></svg>`;if(key.startsWith('guide'))return guideArtDefault(key.slice(6));const i=MODES.findIndex(m=>m.id===key);return `<div class="default-mission-cover">${defaultSvg(['frog','puma','rabbit','owl','dog','mother'][Math.max(0,i)])}<span>${['sapo','P → U','a · b','bú · ho','?','M'][Math.max(0,i)]}</span></div>`}
function guideArtDefault(id){if(id==='luna')return mascot();if(id==='tita')return defaultSvg('owl');const previous=saved.guide;saved.guide='milo';const custom=customCovers['guide-milo'];delete customCovers['guide-milo'];const art=guideArt();if(custom)customCovers['guide-milo']=custom;saved.guide=previous;return art}
function stopNarration(){narrationEpoch++;narrationBusy=false;if('speechSynthesis'in window)speechSynthesis.cancel();duckMusic(false);setGuideSpeaking(false)}
function updateVoiceButton(){const b=document.getElementById('voiceBtn');b.classList.toggle('active',voice);b.setAttribute('aria-pressed',voice);b.textContent=voice?'🔊 Voz automática':'🔇 Voz apagada'}
function setGuideSpeaking(state){document.querySelectorAll('.guide-avatar,.portrait,.intro-portrait').forEach(e=>e.classList.toggle('speaking',state));const e=document.getElementById('guideState');if(e)e.textContent=state?'Te estoy explicando…':'Aquí para ayudarte'}
function guidePanel(text){return `<aside class="guide-panel"><div class="guide-avatar" id="guidePortrait">${guideArt()}</div><h3 id="activeGuideName">${guideName()}</h3><span class="guide-state" id="guideState">Aquí para ayudarte</span><button type="button" class="guide-bubble" id="guideBubble" onclick="completeDialogue()" aria-label="Mostrar diálogo completo">${text}</button><button class="secondary" onclick="repeatInstruction()">🔊 Repetir explicación</button></aside>`}
function guideMessage(text){writeDialogue(text)}
function roundComment(){const id=game.mode.id,w=game.d.w;const comments={match:['¡Nuevas imágenes! Observa sus detalles.','Tu mirada de detective encuentra buenas pistas.','Tómate tu tiempo. ¡Puedes resolverlo!','¡Un nuevo grupo de palabras por descubrir!','Cada pareja es una pista más.'],path:'¡Un nuevo camino para '+w+'! Mira las letras con atención.',letters:'Vamos con '+w+'. ¡Estas letras necesitan tu ayuda!',syllables:'Ahora exploramos '+w+'. ¡Junta sus sonidos!',clues:'Aquí tienes una nueva pista. Piensa con calma.',initial:'¿Con qué letra empieza '+w+'?'};guideMessage(id==='match'?comments.match[(game.round-1)%5]:comments[id]);if(id==='clues')speak(game.d.clue,false,'content');else if(id==='initial')speak('¿Con qué letra empieza '+w+'?',false,'content');else if(id!=='match')speak(w,false,'content')}
function showGuideIntro(){guideMessage(game.instruction);speak(game.instruction,false,'instruction')}
function beginCase(){stopTyping();stopNarration();document.getElementById('dialog').close();guideMessage(game.instruction)}
function chooseGuide(id){stopNarration();saved.guide=id;save();openDesignStudio('guides');const greeting='¡Hola! Soy '+guideName()+'. Te acompañaré a descubrir palabras. ¡Elige un caso y empecemos!';statusMedia(greeting);speak(greeting,false,'instruction')}
function designTabs(tab){return `<div class="studio-tabs">${[['images','Imágenes'],['covers','Portadas'],['guides','Compañeros guía'],['music','Música']].map(([id,label])=>`<button class="pill ${tab===id?'active':''}" onclick="openStudio('${id}')">${label}</button>`).join('')}</div>`}
function openDesignStudio(tab){const dialog=document.getElementById('dialog');dialog.innerHTML=`<h2>Personaliza tu aventura</h2>${designTabs(tab)}${tab==='guides'?`<section class="studio-card"><h3>Elige quién te acompaña</h3><div class="guide-options">${['luna','milo','tita'].map(id=>`<button class="guide-choice ${saved.guide===id?'chosen':''}" onclick="chooseGuide('${id}')"><span>${customCovers['guide-'+id]?coverImg('guide-'+id):guideArtDefault(id)}</span><b>${GUIDE_NAMES[id]}</b></button>`).join('')}</div><p class="media-detail">Tu compañero aparece al iniciar cada juego y se queda contigo durante los retos. También puedes ponerle tu propia imagen en Portadas.</p></section>`:`<section class="studio-card"><h3>Cambiar portadas y personajes</h3><label for="coverSelect">¿Qué imagen quieres cambiar?</label><select id="coverSelect" onchange="coverKey=this.value;renderCoverPreview()">${[['home','Portada principal'],...MODES.map(m=>[m.id,'Portada: '+m.title]),...Object.entries(GUIDE_NAMES).map(([id,name])=>['guide-'+id,'Personaje: '+name])].map(([key,name])=>`<option value="${key}" ${key===coverKey?'selected':''}>${name}</option>`).join('')}</select><div class="cover-preview" id="coverPreview"></div><p id="coverNote" class="media-detail"></p><div class="actions"><label class="upload-label">Cargar imagen<input type="file" class="file-input" accept="image/png,image/jpeg,image/webp" onchange="uploadCover(this.files[0]);this.value=''" aria-label="Cargar portada"></label><button class="secondary" onclick="removeCover()">Restaurar original</button></div><p class="media-detail">PNG, JPG o WebP de hasta 8 MB. Para portadas usa imágenes horizontales; para el personaje, PNG transparente. Las imágenes son opcionales.</p><div class="music-integration"><strong>Tu MP3 como fondo fijo</strong><p>Elige tu audio y descarga una copia del juego que lo incluye. En esa copia no necesitarás cargarlo otra vez.</p><button class="primary" onclick="downloadWithMusic()">↓ Descargar juego con esta música</button></div></section>`}<div class="media-status" id="mediaStatus" role="status" aria-live="polite">Los cambios se guardan en este navegador y dispositivo.</div><div class="actions"><button class="primary" onclick="closeStudio()">Guardar y volver →</button></div>`;if(!dialog.open)dialog.showModal();if(tab==='covers')renderCoverPreview()}
function renderCoverPreview(){document.getElementById('coverPreview').innerHTML=customCovers[coverKey]?coverImg(coverKey):defaultCover(coverKey);document.getElementById('coverNote').textContent=customCovers[coverKey]?'Usando tu imagen personalizada.':'Usando la ilustración incluida.'}
async function uploadCover(file){if(!file)return;const key=coverKey;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){statusMedia('Elige un PNG, JPG o WebP.');return}if(file.size>8*1024*1024){statusMedia('La imagen supera 8 MB. Elige una más pequeña.');return}let url;try{url=URL.createObjectURL(file);await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(Error('No se pudo abrir la imagen.'));img.src=url});await dbWrite({id:'cover:'+key,blob:file,name:file.name});if(customCovers[key])URL.revokeObjectURL(customCovers[key].url);customCovers[key]={url,name:file.name};url=null;renderCoverPreview();statusMedia('¡Imagen guardada! Se verá al volver a la aventura.')}catch(e){statusMedia(e.message||'No se pudo guardar la imagen.')}finally{if(url)URL.revokeObjectURL(url)}}
async function removeCover(){try{await dbWrite({id:'cover:'+coverKey},true);if(customCovers[coverKey])URL.revokeObjectURL(customCovers[coverKey].url);delete customCovers[coverKey];renderCoverPreview();statusMedia('Ilustración original restaurada.')}catch(e){statusMedia('No se pudo restaurar. Intenta otra vez.')}}
document.getElementById('dialog').addEventListener('close',()=>{stopNarration();if(typingTarget==='introDialogue'){stopTyping();if(game)guideMessage(game.instruction)}});

let typingTimer=null,typingEpoch=0,typingText='',typingIndex=0,typingTarget='guideBubble';let effects=saved.effects!==false;
function unlockEffects(){if(!effects)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}}
function typingTick(){if(!effects||!audioCtx||audioCtx.state==='suspended')return;try{const o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(610+(typingIndex%5)*55,audioCtx.currentTime);gain.gain.setValueAtTime(narrationBusy?.009:.019,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.035);o.connect(gain);gain.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.04)}catch(e){}}
function stopTyping(){typingEpoch++;if(typingTimer!==null)clearTimeout(typingTimer);typingTimer=null}
function writeDialogue(text,target='guideBubble'){const box=document.getElementById(target);if(!box)return;stopTyping();typingText=text;typingIndex=0;typingTarget=target;const epoch=typingEpoch;box.innerHTML='<span class="typed-copy" aria-hidden="true"></span><span class="sr-only"></span><span class="dialogue-cursor" aria-hidden="true">▍</span>';box.setAttribute('aria-label',text+' Toca para mostrar el texto completo.');const accessible=box.querySelector('.sr-only');if(accessible)accessible.textContent=text;const copy=box.querySelector('.typed-copy');if(!copy){box.textContent=text;typingIndex=text.length;return}if(matchMedia('(prefers-reduced-motion: reduce)').matches){completeDialogue();return}function step(){if(epoch!==typingEpoch||!document.getElementById(target))return;typingIndex++;copy.textContent=text.slice(0,typingIndex);const char=text[typingIndex-1];if(/[\p{L}\p{N}]/u.test(char)&&typingIndex%2===0)typingTick();if(typingIndex<text.length){const delay=/[.!?]/.test(char)?210:/[,;:]/.test(char)?115:char===' '?45:29;typingTimer=setTimeout(step,delay)}else{typingTimer=null;const cursor=box.querySelector('.dialogue-cursor');if(cursor)cursor.textContent='▼';box.classList.add('text-complete')}}step()}
function completeDialogue(){stopTyping();typingIndex=typingText.length;const box=document.getElementById(typingTarget);if(!box)return;const copy=box.querySelector('.typed-copy');if(copy)copy.textContent=typingText;else box.textContent=typingText;const cursor=box.querySelector('.dialogue-cursor');if(cursor)cursor.textContent='▼';box.classList.add('text-complete')}
function toggleEffects(){effects=!effects;saved.effects=effects;save();updateEffectsButton();if(effects)unlockEffects()}
function updateEffectsButton(){const b=document.getElementById('effectsBtn');b.textContent=effects?'♪ Efectos':'♪ Sin efectos';b.setAttribute('aria-pressed',effects);b.classList.toggle('active',effects)}

function effectTone(freq,duration=.075,delay=0,gainValue=.04){if(!effects||!audioCtx)return;try{const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.78,t+duration);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(gainValue,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.01)}catch(e){}}
function buttonEffect(button){if(!effects)return;unlockEffects();if(button.classList.contains('letter')||button.classList.contains('tile')||button.classList.contains('slot'))effectTone(540,.06,0,.025);else if(button.classList.contains('primary')){effectTone(520,.075);effectTone(740,.08,.06)}else effectTone(420,.065,0,.028)}
async function startBackgroundMusic(){if(!musicRecord||saved.musicEnabled===false||!music.paused)return;try{duckMusic(narrationBusy);await music.play();updateMusicButton()}catch(e){/* A later play button can unlock audio. */}}
async function toggleFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){modal('<h2>Pantalla completa</h2><p>Este navegador no permite activar pantalla completa. Puedes usar el modo de pantalla completa de tu navegador.</p>')}}
function readAudioData(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('No se pudo leer el MP3.'));reader.readAsDataURL(blob)})}
function parseEmbeddedMusic(text){const data=JSON.parse(text);if(!data||typeof data.name!=='string'||typeof data.data!=='string'||!/^data:audio\/[a-z0-9.+-]+;base64,/i.test(data.data))throw Error('Audio integrado no válido.');return data}
function loadEmbeddedMusic(){const node=document.getElementById('embeddedMusic');if(!node||!node.textContent.trim())return;try{const data=parseEmbeddedMusic(node.textContent),parts=data.data.split(','),bytes=Uint8Array.from(atob(parts[1]),c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:parts[0].slice(5).split(';')[0]});musicRecord={id:'music',name:data.name,blob,embedded:true};musicURL=URL.createObjectURL(blob);music.src=musicURL;if(typeof data.volume==='number')volume=Math.max(0,Math.min(1,data.volume));music.volume=volume;updateMusicButton()}catch(e){console.warn('No se pudo cargar la música integrada.')}}
async function downloadWithMusic(){if(!musicRecord?.blob){statusMedia('Primero elige el MP3 que quieres usar de fondo.');return}try{statusMedia('Preparando tu juego con la música integrada…');const data=await readAudioData(musicRecord.blob);const doc=new DOMParser().parseFromString(document.documentElement.outerHTML,'text/html');doc.getElementById('embeddedMusic')?.remove();doc.getElementById('app').innerHTML='';const dialog=doc.getElementById('dialog');dialog.innerHTML='';dialog.removeAttribute('open');doc.body.classList.remove('playing');doc.querySelectorAll('.confetti').forEach(e=>e.remove());const embedded=doc.createElement('script');embedded.type='application/json';embedded.id='embeddedMusic';embedded.textContent=JSON.stringify({name:musicRecord.name,data,volume}).replace(/</g,'\\u003c');doc.head.appendChild(embedded);const blob=new Blob(['<!DOCTYPE html>\n'+doc.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Somos_Detectives_Con_Musica.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);statusMedia('¡Descarga preparada! Ese HTML contiene tu música de fondo y comienza a reproducirla al entrar a un juego.')}catch(e){statusMedia(e.message||'No se pudo preparar la descarga.')}}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(button&&!button.disabled&&button.id!=='effectsBtn'&&!button.classList.contains('guide-bubble'))buttonEffect(button)},true);

function derangeWords(left){const offset=1+Math.floor(Math.random()*(left.length-1));return left.map((_,i)=>left[(i+offset)%left.length])}
function firstLetter(word){return word[0].normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()}
function initialAnswer(letter,button){if(lock)return;const correct=firstLetter(game.d.w);if(letter===correct){button.classList.add('matched');success();guideMessage('¡Muy bien! '+game.d.w+' empieza con '+correct+'.')}else{button.disabled=true;button.style.opacity='.45';feedback('Escucha el comienzo de '+game.d.w+'. Busca la letra '+correct+'.',true)}}
function boardScale(width,height,naturalWidth,naturalHeight){if(width<=0||height<=0||naturalWidth<=0||naturalHeight<=0)return 1;return Math.min(1,width/naturalWidth,height/naturalHeight)}
let fitObserver=null,contentObserver=null,fitFrame=0;
function scheduleBoardFit(){if(typeof requestAnimationFrame!=='function')return;if(fitFrame)cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(()=>{fitFrame=0;fitGameBoard()})}
function fitGameBoard(){if(!game||!document.body.classList.contains('playing'))return;const desk=document.querySelector('.detective-desk'),shell=desk?.querySelector('.game-shell');if(!desk||!shell||desk.clientWidth<1||desk.clientHeight<1)return;shell.style.transform='none';shell.style.width=Math.min(1580,Math.max(1,desk.clientWidth-8))+'px';const rect=shell.getBoundingClientRect(),scale=boardScale(desk.clientWidth-4,desk.clientHeight-5,rect.width,rect.height);shell.style.transform='scale('+scale+')';shell.style.transformOrigin='top center'}
function setupBoardFit(){if(typeof document.querySelector!=='function')return;fitObserver?.disconnect();contentObserver?.disconnect();const desk=document.querySelector('.detective-desk'),shell=desk?.querySelector('.game-shell');if(!desk||!shell)return;if(typeof ResizeObserver!=='undefined'){fitObserver=new ResizeObserver(scheduleBoardFit);fitObserver.observe(desk)}if(typeof MutationObserver!=='undefined'){contentObserver=new MutationObserver(scheduleBoardFit);contentObserver.observe(shell,{childList:true,subtree:true,characterData:true})}scheduleBoardFit()}
function stopBoardFit(){fitObserver?.disconnect();contentObserver?.disconnect();fitObserver=contentObserver=null;if(fitFrame&&typeof cancelAnimationFrame==='function')cancelAnimationFrame(fitFrame);fitFrame=0}
window.addEventListener('resize',scheduleBoardFit);document.addEventListener('load',scheduleBoardFit,true);

loadEmbeddedMusic();home();updateVoiceButton();updateEffectsButton();loadMedia();
</script></body></html>
