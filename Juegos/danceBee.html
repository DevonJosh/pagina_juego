<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#ec4899;--cyan:#06b6d4;--success:#10b981;--text:#f8fafc;--muted:#94a3b8;--tile:72px;--gap:7px}
*{box-sizing:border-box}html{min-width:280px}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 10% 15%,#8b5cf626,transparent 40%),radial-gradient(circle at 90% 85%,#ec489920,transparent 40%),#030508;color:var(--text);font-family:Outfit,sans-serif;padding:clamp(8px,2vw,22px);overflow-x:hidden}button{font:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #22d3ee;outline-offset:3px}header{text-align:center;margin:0 0 14px}h1{margin:0 0 9px;font-size:clamp(1.3rem,3vw,2.5rem);font-weight:900;letter-spacing:clamp(1px,.35vw,4px);background:linear-gradient(135deg,#fff 20%,#ec4899 60%,#06b6d4);background-clip:text;-webkit-background-clip:text;color:transparent}.music-toggle{background:#ec48991a;border:1px solid var(--primary);color:#fbcfe8;padding:8px 16px;border-radius:30px;font-weight:700;cursor:pointer;max-width:100%}.music-toggle span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main-container{display:grid;grid-template-columns:minmax(170px,220px) minmax(220px,270px) minmax(0,1fr);grid-template-areas:'playlist controls floor';gap:clamp(10px,1.5vw,20px);max-width:1350px;margin:auto;padding:clamp(10px,1.8vw,24px);border:1px solid #ec489933;border-radius:24px;background:#0d111cc9;box-shadow:0 24px 60px #0009;min-width:0}.playlist-section,.controls-section,.dance-floor-section{min-width:0}.playlist-section{grid-area:playlist;background:#03071299;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:7px}.playlist-title{color:var(--primary);font-size:.85rem;font-weight:800;letter-spacing:2px}.playlist-subtitle,.playlist-info{color:var(--muted);font-size:.73rem}.playlist-subtitle{margin-bottom:6px}.song{width:100%;min-height:39px;display:flex;align-items:center;gap:8px;background:#111827b0;border:1px solid #ffffff12;border-radius:11px;padding:9px;color:white;text-align:left;cursor:pointer}.song.active{border-color:var(--primary);background:linear-gradient(90deg,#ec489944,#8b5cf626)}.song-number{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-weight:800;font-size:.75rem}.song-name{font-size:.8rem;overflow-wrap:anywhere}.music-player{width:100%;margin-top:auto;min-width:0;height:44px}.playlist-info{line-height:1.4;margin-top:5px}.controls-section{grid-area:controls;display:flex;flex-direction:column;gap:12px}.sequence-container{background:#03071299;border:1px solid #ffffff12;border-radius:16px;padding:13px;min-height:112px;display:flex;flex-direction:column;gap:8px}.sequence-title{font-size:.75rem;color:var(--muted);font-weight:800;letter-spacing:1px}.sequence-list{display:flex;flex-wrap:wrap;gap:6px;max-height:95px;overflow:auto;align-content:start}.seq-step{background:#1f2937;color:var(--cyan);border-radius:8px;padding:5px 7px;display:flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:.8rem}.seq-step img{width:18px;height:18px;object-fit:contain}.seq-step.active{background:var(--primary);color:white;box-shadow:0 0 12px #ec489988}.system-msg{font-size:.78rem;color:#34d399;font-weight:700;min-height:20px}.d-pad{--btn:clamp(54px,5.5vw,74px);display:grid;grid-template-areas:'. up .' 'left go right' '. down .';grid-template-columns:repeat(3,var(--btn));grid-template-rows:repeat(3,var(--btn));gap:clamp(6px,1vw,10px);justify-content:center;align-content:center}.d-btn{width:100%;height:100%;border:1px solid #ffffff20;border-radius:19px;background:#1f2937;color:white;box-shadow:0 5px 0 #0008;display:flex;align-items:center;justify-content:center;cursor:pointer}.d-btn img{width:48%;height:48%;object-fit:contain}.d-btn:active,.action-btn:active{transform:translateY(3px)}.d-btn:disabled,.action-btn:disabled{opacity:.45;cursor:not-allowed}#btn-up{grid-area:up}#btn-down{grid-area:down}#btn-left{grid-area:left}#btn-right{grid-area:right}#btn-go{grid-area:go;background:linear-gradient(135deg,#10b981,#059669);border-radius:50%;font-weight:900;font-size:1.1rem;box-shadow:0 5px 0 #022c22}.action-buttons{display:flex;gap:8px}.action-btn{flex:1;min-width:0;min-height:43px;border:0;border-radius:12px;color:white;font-weight:800;font-size:.77rem;cursor:pointer}#btn-pause{background:linear-gradient(135deg,#f59e0b,#d97706)}#btn-clear{background:linear-gradient(135deg,#f43f5e,#dc2626)}.dance-floor-section{grid-area:floor;position:relative;display:flex;align-items:center;justify-content:center;min-height:clamp(280px,39vw,540px);padding:clamp(9px,2vw,24px);background:radial-gradient(circle,#111827cc,#030712f2 90%);border:1px solid #ffffff12;border-radius:20px;overflow:hidden;box-shadow:inset 0 0 45px #000a}.dance-grid{display:grid;grid-template-columns:repeat(5,var(--tile));grid-template-rows:repeat(5,var(--tile));gap:var(--gap);position:relative;z-index:2}.floor-tile{border:1px solid #ffffff12;border-radius:clamp(5px,1vw,13px);background:#11182790;box-shadow:inset 0 0 12px #0008;transition:background .25s,box-shadow .25s}.floor-tile.disco-pink{background:#ec48998c;box-shadow:0 0 20px #ec4899bb,inset 0 0 20px #ec4899}.floor-tile.disco-cyan{background:#06b6d48c;box-shadow:0 0 20px #06b6d4bb,inset 0 0 20px #06b6d4}.floor-tile.disco-purple{background:#8b5cf68c;box-shadow:0 0 20px #8b5cf6bb,inset 0 0 20px #8b5cf6}.floor-tile.disco-yellow{background:#f59e0b8c;box-shadow:0 0 20px #f59e0bbb,inset 0 0 20px #f59e0b}.floor-tile.disco-green{background:#10b9818c;box-shadow:0 0 20px #10b981bb,inset 0 0 20px #10b981}.bee-wrapper{position:absolute;z-index:4;width:calc(var(--tile) * .77);height:calc(var(--tile) * .93);pointer-events:none;transition:left .4s ease,top .4s ease;display:flex;align-items:center;justify-content:center}.bee{width:100%;height:100%;position:relative;filter:drop-shadow(0 8px 12px #0009) drop-shadow(0 0 8px #ec489980)}.antenna{width:3px;height:20%;background:#94a3b8;position:absolute;top:-13%;border-radius:2px;z-index:1}.antenna:after{content:'';position:absolute;width:8px;height:8px;top:-4px;left:-2.5px;background:#ec4899;border-radius:50%;box-shadow:0 0 8px #ec4899}.antenna.left{left:27%;transform:rotate(-15deg)}.antenna.right{right:27%;transform:rotate(15deg)}.wing{position:absolute;width:57%;height:58%;top:12%;background:linear-gradient(135deg,#ffffffe8,#ec48994d);border:1px solid #fffd;border-radius:50% 50% 20% 50%;z-index:-1;box-shadow:0 0 12px #ec489977}.wing.left{left:-25%;animation:wing-flutter-left .09s ease-in-out infinite alternate}.wing.right{right:-25%;animation:wing-flutter-right .09s ease-in-out infinite alternate}@keyframes wing-flutter-left{from{transform:rotate(-25deg) scale(1)}to{transform:rotate(30deg) scale(1.08)}}@keyframes wing-flutter-right{from{transform:scaleX(-1) rotate(-25deg) scale(1)}to{transform:scaleX(-1) rotate(30deg) scale(1.08)}}.bee-body{width:100%;height:100%;position:absolute;overflow:hidden;border-radius:45%;border:2px solid #030712;background:linear-gradient(135deg,#fb7185,#e11d48);box-shadow:inset -8px -8px 15px #0008,inset 5px 5px 10px #fff6}.bee-stripes{position:absolute;top:35%;width:100%;height:15%;background:#030712;box-shadow:0 calc(var(--tile) * .24) 0 #030712}.visor{position:absolute;top:12%;left:15%;right:15%;height:25%;background:#030712;border-radius:10px;display:flex;justify-content:space-around;align-items:center}.eye-led{width:13%;height:50%;background:var(--cyan);border-radius:3px;box-shadow:0 0 8px var(--cyan)}.bee.dancing-up{animation:hop-up .4s ease}.bee.dancing-down{animation:hop-down .4s ease}.bee.dancing-left{animation:lean-left .4s ease}.bee.dancing-right{animation:lean-right .4s ease}@keyframes hop-up{50%{transform:translateY(-8px) rotate(-6deg)}}@keyframes hop-down{50%{transform:translateY(8px) rotate(6deg)}}@keyframes lean-left{50%{transform:rotate(-28deg) scale(1.07)}}@keyframes lean-right{50%{transform:rotate(28deg) scale(1.07)}}
@media(max-width:1050px){.main-container{grid-template-columns:minmax(190px,.8fr) minmax(0,1.2fr);grid-template-areas:'playlist floor' 'controls floor'}.controls-section{justify-content:start}.dance-floor-section{min-height:420px}.d-pad{--btn:clamp(55px,7vw,74px)}}

@media(max-width:420px){.controls-section{grid-template-columns:1fr;grid-template-areas:'seq' 'pad' 'actions'}.d-pad{--btn:clamp(57px,18vw,72px)}.dance-floor-section{aspect-ratio:1.08}.playlist-section{padding:10px}.song{padding:8px}.song-name{font-size:.73rem}}
@media(max-height:520px) and (orientation:landscape) and (max-width:950px){body{padding:6px}header{margin-bottom:6px}h1{font-size:1.2rem;margin-bottom:3px}.music-toggle{padding:4px 10px;font-size:.75rem}.main-container{grid-template-columns:minmax(125px,.85fr) minmax(160px,1fr) minmax(0,1.5fr);grid-template-areas:'playlist controls floor';gap:7px;padding:7px}.playlist-section{display:flex;padding:8px;gap:3px}.playlist-subtitle,.playlist-info{display:none}.song{min-height:27px;padding:4px}.song-name{font-size:.7rem}.music-player{height:32px}.controls-section{display:flex;gap:5px}.sequence-container{min-height:60px;padding:6px;gap:3px}.sequence-list{max-height:38px}.d-pad{--btn:clamp(38px,10vh,53px);gap:4px}.action-btn{min-height:30px;font-size:.67rem}.dance-floor-section{min-height:0;padding:6px;aspect-ratio:auto}}

/* CELULAR VERTICAL: pista ARRIBA, controles COMPLETOS ABAJO, playlist al final */
@media (orientation:portrait) and (max-width:730px) {
 body{padding:4px 7px 12px}
 header{margin-bottom:5px}
 header h1{font-size:clamp(1.05rem,4.5vw,1.5rem);margin-bottom:3px;letter-spacing:1px}
 .music-toggle{padding:4px 10px;font-size:.72rem}
 .main-container{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:'floor' 'controls' 'playlist';gap:clamp(5px,1vh,10px);padding:5px;background:transparent;border:0;box-shadow:none}
 .dance-floor-section{grid-area:floor;justify-self:center;align-self:center;width:min(100%,calc(43dvh + 10px));height:min(calc(43dvh + 10px),calc(100vw - 24px));min-height:0;aspect-ratio:1/1;padding:5px;border-radius:14px}

}
@media (orientation:portrait) and (max-width:730px) and (max-height:650px) {
 header h1{font-size:1.05rem}
 .music-toggle{padding:3px 9px}
 .dance-floor-section{width:min(100%,39dvh);height:min(calc(100vw - 24px),39dvh)}
 .sequence-container{padding:4px 7px}
 .sequence-list{max-height:23px}
 .d-pad{--btn:clamp(33px,7dvh,46px);gap:3px}
 .action-btn{min-height:30px}
 .playlist-section{margin-top:8px}
}
@media (orientation:landscape) and (max-width:950px){
 .main-container{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:'controls floor' 'playlist playlist';gap:8px}
 .playlist-section{grid-area:playlist}
 .controls-section{grid-area:controls}

<body>
<header><h1>ROBOT BEE DANCE</h1><div class="music-bar"><button class="music-toggle" onclick="toggleMusic()"><span id="music-icon">🎵</span> <span id="music-text">Reproducir Música</span></button></div></header>
<main class="main-container">
<section class="playlist-section" aria-label="Playlist"><div class="playlist-title">🎧 PLAYLIST</div><div class="playlist-subtitle">Canciones personalizadas</div>
<button class="song active" onclick="playSong(0)"><span class="song-number">01</span><span class="song-name">Canción Rene</span></button>
<button class="song" onclick="playSong(1)"><span class="song-number">02</span><span class="song-name">Canción Gold</span></button>
<button class="song" onclick="playSong(2)"><span class="song-number">03</span><span class="song-name">CARNAVAL DE AREQUIPA</span></button>
<button class="song" onclick="playSong(3)"><span class="song-number">04</span><span class="song-name">Aeropickles</span></button>
<button class="song" onclick="playSong(4)"><span class="song-number">05</span><span class="song-name">Canción 5</span></button>
<audio id="music-player" class="music-player" controls preload="metadata"></audio><div class="playlist-info">Los audios se cargan desde <b>../assets/musica/</b> y las flechas desde <b>../assets/img_controlBe/</b>.</div></section>
<section class="controls-section" aria-label="Programación"><div class="sequence-container"><div class="sequence-title">PASOS DE BAILE PROGRAMADOS</div><div class="sequence-list" id="sequence-list"></div><div class="system-msg" id="system-msg" aria-live="polite">Programa los movimientos y pulsa GO.</div></div>
<div class="d-pad"><button class="d-btn direction" id="btn-up" aria-label="Agregar arriba" onclick="handleManualMove('up')"><img src="../assets/img_controlBe/Arriba.png" alt="↑"></button><button class="d-btn direction" id="btn-left" aria-label="Agregar izquierda" onclick="handleManualMove('left')"><img src="../assets/img_controlBe/Izquierda.png" alt="←"></button><button class="d-btn" id="btn-go" onclick="startExecution()" aria-label="Ejecutar programa">▶ GO</button><button class="d-btn direction" id="btn-right" aria-label="Agregar derecha" onclick="handleManualMove('right')"><img src="../assets/img_controlBe/Derecha.png" alt="→"></button><button class="d-btn direction" id="btn-down" aria-label="Agregar abajo" onclick="handleManualMove('down')"><img src="../assets/img_controlBe/Abajo.png" alt="↓"></button></div>
<div class="action-buttons"><button class="action-btn" id="btn-pause" onclick="togglePause()"><span id="pause-icon">⏸</span> <span id="pause-label">PAUSA</span></button><button class="action-btn" id="btn-clear" onclick="clearProgram()">✕ BORRAR</button></div></section>
<section class="dance-floor-section" id="floor" aria-label="Pista de baile de cinco por cinco"><div class="dance-grid" id="dance-grid"></div><div class="bee-wrapper" id="bee-wrapper"><div class="bee" id="bee"><div class="antenna left"></div><div class="antenna right"></div><div class="wing left"></div><div class="wing right"></div><div class="bee-body"><div class="visor"><div class="eye-led"></div><div class="eye-led"></div></div><div class="bee-stripes"></div></div></div></div></section>
</main>
<script>
const songs=[{name:'Rene',file:'../assets/musica/rene.mp3'},{name:'Canción Gold',file:'../assets/musica/Gold.mp3'},{name:'Canción CARNAVAL',file:'../assets/musica/Carnaval.mp3'},{name:'Aeropickles',file:'../assets/musica/Aeropickles.mp3'},{name:'Canción 5',file:'../assets/musica/Carnaval.mp3'}];
const stepImages={up:'../assets/img_controlBe/Arriba.png',down:'../assets/img_controlBe/Abajo.png',left:'../assets/img_controlBe/Izquierda.png',right:'../assets/img_controlBe/Derecha.png'};
const labels={up:'Arriba',down:'Abajo',left:'Izquierda',right:'Derecha'};
const player=document.getElementById('music-player'),bee=document.getElementById('bee'),wrapper=document.getElementById('bee-wrapper'),grid=document.getElementById('dance-grid'),floor=document.getElementById('floor');
let currentSong=0,sequence=[],isExecuting=false,isPaused=false,currentStepIndex=0,gridRow=2,gridCol=2,runToken=0,stepTimer=null,remaining=0,stepStarted=0,stepCallback=null;
const tiles=[];const discoColors=['disco-pink','disco-cyan','disco-purple','disco-yellow','disco-green'];
for(let r=0;r<5;r++)for(let c=0;c<5;c++){const tile=document.createElement('div');tile.className='floor-tile';tile.dataset.row=r;tile.dataset.col=c;grid.append(tile);tiles.push(tile)}
function setSystemMessage(s){document.getElementById('system-msg').textContent=s}
function updateMusicUI(){const playing=!player.paused;document.getElementById('music-icon').textContent=playing?'🔊':'🎵';document.getElementById('music-text').textContent=playing?songs[currentSong].name:'Reproducir Música'}
function playSong(index){currentSong=index;player.src=songs[index].file;document.querySelectorAll('.song').forEach((el,i)=>el.classList.toggle('active',i===index));player.play().catch(()=>setSystemMessage('Pulsa reproducir para activar la música.'));updateMusicUI()}
function toggleMusic(){if(!player.getAttribute('src'))player.src=songs[currentSong].file;if(player.paused)player.play().catch(()=>setSystemMessage('No se pudo reproducir el audio.'));else player.pause();updateMusicUI()}
player.addEventListener('play',updateMusicUI);player.addEventListener('pause',updateMusicUI);player.addEventListener('ended',()=>playSong((currentSong+1)%songs.length));
function speak(text){if(!('speechSynthesis'in window))return;const synth=window.speechSynthesis;synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.9;u.pitch=.85;const voices=synth.getVoices();u.voice=voices.find(v=>v.lang.startsWith('es')&&/male|pablo|carlos|diego|jorge|alvaro|raul/i.test(v.name))||voices.find(v=>v.lang.startsWith('es'))||null;synth.speak(u)}
function updateTileHighlight(){tiles.forEach(tile=>{const active=+tile.dataset.row===gridRow&&+tile.dataset.col===gridCol;tile.className='floor-tile'+(active?' '+discoColors[Math.floor(Math.random()*discoColors.length)]:'')})}
function positionBee(animate=true){const tile=tiles[gridRow*5+gridCol];if(!tile)return;const gridRect=grid.getBoundingClientRect(),tileRect=tile.getBoundingClientRect(),floorRect=floor.getBoundingClientRect();const size=tileRect.width;wrapper.style.width=`${size*.77}px`;wrapper.style.height=`${size*.93}px`;wrapper.style.transition=animate?'left .4s ease, top .4s ease':'none';wrapper.style.left=`${tileRect.left-floorRect.left+tileRect.width/2-size*.77/2}px`;wrapper.style.top=`${tileRect.top-floorRect.top+tileRect.height/2-size*.93/2}px`;updateTileHighlight()}
function fitGrid(){const cs=getComputedStyle(floor),availableWidth=floor.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-2,availableHeight=floor.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-2;const gap=Math.max(3,Math.min(8,Math.min(availableWidth,availableHeight)*.014));const tile=Math.max(12,Math.min(78,(Math.min(availableWidth,availableHeight)-4*gap)/5));grid.style.setProperty('--tile',tile+'px');grid.style.setProperty('--gap',gap+'px');positionBee(false)}
if('ResizeObserver'in window)new ResizeObserver(fitGrid).observe(floor);else window.addEventListener('resize',fitGrid);window.addEventListener('load',fitGrid);requestAnimationFrame(fitGrid);
function renderSequence(){const list=document.getElementById('sequence-list');list.replaceChildren();sequence.forEach((step,i)=>{const el=document.createElement('div');el.className='seq-step';el.id=`step-${i}`;const num=document.createTextNode((i+1)+' '),img=document.createElement('img');img.src=stepImages[step];img.alt=labels[step];el.append(num,img);list.append(el)})}
function highlightStep(i){document.querySelectorAll('.seq-step').forEach((el,j)=>el.classList.toggle('active',i===j));document.getElementById(`step-${i}`)?.scrollIntoView?.({block:'nearest',inline:'nearest',behavior:'smooth'})}
function handleManualMove(dir){if(isExecuting)return;sequence.push(dir);renderSequence();setSystemMessage(`${labels[dir]} añadido. Pulsa GO para mover la abeja.`);speak(labels[dir])}
function controlsBusy(busy){document.querySelectorAll('.direction').forEach(b=>b.disabled=busy);document.getElementById('btn-go').disabled=busy}
function clearTimer(){if(stepTimer!==null)clearTimeout(stepTimer);stepTimer=null;stepCallback=null;remaining=0}
function waitStep(ms,callback){remaining=ms;stepStarted=performance.now();stepCallback=callback;stepTimer=setTimeout(()=>{stepTimer=null;stepCallback=null;callback()},ms)}
function runNextStep(token){if(token!==runToken||!isExecuting||isPaused)return;if(currentStepIndex>=sequence.length){isExecuting=false;controlsBusy(false);highlightStep(-1);bee.className='bee';setSystemMessage('¡Baile completado con éxito!');return}const dir=sequence[currentStepIndex];highlightStep(currentStepIndex);let moved=false;if(dir==='up'&&gridRow>0){gridRow--;moved=true}else if(dir==='down'&&gridRow<4){gridRow++;moved=true}else if(dir==='left'&&gridCol>0){gridCol--;moved=true}else if(dir==='right'&&gridCol<4){gridCol++;moved=true}bee.className='bee';if(moved){void bee.offsetWidth;bee.classList.add('dancing-'+dir);positionBee(true);setSystemMessage(`Ejecutando: ${labels[dir]}`)}else setSystemMessage(`Límite de pista: ${labels[dir]}. Continúa el programa.`);currentStepIndex++;waitStep(600,()=>{bee.className='bee';runNextStep(token)})}
async function startExecution(){if(isExecuting)return;if(!sequence.length){setSystemMessage('Agrega primero algunos pasos.');speak('Primero programa algunos movimientos');return}runToken++;const token=runToken;clearTimer();isExecuting=true;isPaused=false;currentStepIndex=0;gridRow=2;gridCol=2;bee.className='bee';positionBee(false);controlsBusy(true);document.getElementById('pause-icon').textContent='⏸';document.getElementById('pause-label').textContent='PAUSA';setSystemMessage('¡Comienza el baile!');if(!player.getAttribute('src'))player.src=songs[currentSong].file;try{if(player.readyState<1)await new Promise(resolve=>{const done=()=>resolve();player.addEventListener('loadedmetadata',done,{once:true});setTimeout(done,900)});if(token!==runToken)return;player.currentTime=Number.isFinite(player.duration)&&player.duration>35?35:0;await player.play().catch(()=>{});}catch(e){}if(token!==runToken)return;updateMusicUI();runNextStep(token)}
function togglePause(){if(!isExecuting)return;isPaused=!isPaused;const icon=document.getElementById('pause-icon'),label=document.getElementById('pause-label');if(isPaused){if(stepTimer!==null){clearTimeout(stepTimer);stepTimer=null;remaining=Math.max(0,remaining-(performance.now()-stepStarted))}bee.style.animationPlayState='paused';wrapper.style.transition='none';player.pause();icon.textContent='▶';label.textContent='SEGUIR';setSystemMessage('Baile pausado.')}else{bee.style.animationPlayState='running';icon.textContent='⏸';label.textContent='PAUSA';player.play().catch(()=>{});setSystemMessage('Baile reanudado.');if(stepCallback){const callback=stepCallback;waitStep(remaining,callback)}else runNextStep(runToken)}updateMusicUI()}
function clearProgram(){runToken++;clearTimer();sequence=[];isExecuting=false;isPaused=false;currentStepIndex=0;gridRow=2;gridCol=2;bee.className='bee';bee.style.animationPlayState='running';controlsBusy(false);renderSequence();highlightStep(-1);positionBee(false);document.getElementById('pause-icon').textContent='⏸';document.getElementById('pause-label').textContent='PAUSA';setSystemMessage('Secuencia borrada. ¡Programa otro baile!')}
</script></body></html>
